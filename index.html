  const linesOf = id => r.lines.filter(l => l.doc === id);
  app.innerHTML = `
    <div id="m">${note ? `<div class="msg ok">${esc(note)}</div>` : ''}</div>
    <div class="card"><div class="t">ค้างจ่ายทั้งหมด ${baht(r.owed)} บาท (${r.open.length} ใบ)</div><p class="s">เพิ่มเอกสารใหม่ที่แท็บ 📷 ถ่ายเอกสาร · เลือกใบที่จะจ่ายแล้วกดจ่าย</p></div>
    <div class="list">${r.open.map(p => `<div class="row" style="flex-wrap:wrap"><label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink);flex:1">
      <input type="checkbox" class="pSel" value="${esc(p.id)}" data-amt="${p.total}" style="width:auto;height:auto;margin-top:4px"><div class="grow">
      <div class="t">${esc(p.vendor)} · ${baht(p.total)}</div><div class="s">${esc(p.docType)} ${esc(p.docNo || '')} · ${esc(p.date)}</div>
      <div class="s ${dueCls(p)}">ครบกำหนด ${esc(p.due || '-')}</div>
      ${linesOf(p.id).length ? `<details><summary class="s" style="cursor:pointer">งาน ${linesOf(p.id).length} รายการ</summary>${linesOf(p.id).map(l => `<div class="s ${l.check && l.check !== 'ตรง' ? 'warn' : ''}">${esc(l.date)} · ${esc(l.patient || '-')} · ${esc(l.doctor || '-')} · ${baht(l.amount)}${l.check && l.check !== 'ตรง' ? ' · ' + esc(l.check) : ''}</div>`).join('')}</details>` : ''}
      ${p.photo ? `<a class="s" href="${esc(p.photo)}" target="_blank" rel="noopener">ดูเอกสาร</a>` : ''}</div></label></div>`).join('') || '<div class="row s">ไม่มีค้างจ่าย 🎉</div>'}</div>
    <form id="payF" class="card"><div class="t">จ่ายใบที่เลือก</div><div class="s" id="paySel">ยังไม่ได้เลือก</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px"><div><label>ยอดที่จ่าย</label><input id="payAmt" type="number" inputmode="decimal"></div>
        <div><label>จ่ายด้วย</label><select id="payM">${opts(['โอน', 'จ่ายบิล', 'บัตรเครดิต', 'เงินสด', 'เช็ค'])}</select></div></div>
      <label>สลิป (ถ้ามี)</label><input id="paySlip" type="file" accept="image/*">
      <button class="btn" type="submit" style="width:100%;margin-top:8px">บันทึกว่าจ่ายแล้ว</button></form>
    <details class="card"><summary class="t" style="cursor:pointer">ค่าใช้จ่ายประจำ (${r.recur.length})</summary>
      ${r.recur.map(x => `<div class="row" style="flex-wrap:wrap"><div class="grow"><div class="t">${esc(x.name)} · ${baht(x.amount)}</div><div class="s">ทุกวันที่ ${x.day} · ${esc(x.cat)} ${esc(x.to || '')}</div></div>
        ${x.paid ? '<span class="pill">เดือนนี้จ่ายแล้ว</span>' : `<button class="btn small" data-rp="${esc(x.id)}" data-amt="${x.amount}">จ่ายเดือนนี้</button>`}</div>`).join('') || '<p class="s">ยังไม่มี</p>'}
      <form id="recF"><div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:0 8px"><div><label>รายการ</label><input id="recN" required placeholder="ค่าเช่า / ค่าไฟ / เน็ต"></div>
        <div><label>ยอด</label><input id="recA" type="number"></div><div><label>วันที่จ่าย</label><input id="recD" type="number" min="1" max="31" required></div></div>
        <label>ผู้รับ/บัญชี</label><input id="recT"><button class="btn ghost small" type="submit" style="width:100%;margin-top:6px">+ เพิ่มค่าใช้จ่ายประจำ</button></form></details>

  const sel = () => [...app.querySelectorAll('.pSel:checked')];
  app.querySelectorAll('.pSel').forEach(c => c.onchange = () => { const s = sel(); const t = s.reduce((n, x) => n + num2(x.dataset.amt), 0); paySel.textContent = s.length ? `เลือก ${s.length} ใบ รวม ${baht(t)} บาท` : 'ยังไม่ได้เลือก'; payAmt.value = s.length ? t : ''; });
  payF.onsubmit = async ev => { ev.preventDefault();
    const ids = sel().map(x => x.value); if (!ids.length) return flash('เลือกใบที่จะจ่าย');

    let res = await call('payPay', { ids, amount: payAmt.value, method: payM.value, slips: slips || [] });
    if (!res.ok && res.error === 'pay_mismatch' && confirm(res.msg)) res = await call('payPay', { ids, amount: payAmt.value, method: payM.value, slips: slips || [], force: true });
    if (!res.ok) return flash(errV2(res));
    viewPay('บันทึกจ่ายแล้ว');

    const res = await call('recurPay', { id: b.dataset.rp, amount: amt }); if (!res.ok) return flash(errV2(res)); viewPay('บันทึกแล้ว');
  });
  recF.onsubmit = async ev => { ev.preventDefault(); const res = await call('recurSave', { name: recN.value, amount: recA.value, day: recD.value, to: recT.value }); if (!res.ok) return flash(errV2(res)); viewPay('เพิ่มแล้ว'); };
  venF.onsubmit = async ev => { ev.preventDefault(); const res = await call('vendorSave', { name: venN.value, cat: venC.value, bank: venB.value, terms: venT.value }); if (!res.ok) return flash(errV2(res)); viewPay('บันทึกผู้ขายแล้ว'); };
}
const addDaysISO = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('en-CA'); };

// ---------- DF ----------
async function viewDF(note, month) {
  month = month || todayISO().slice(0, 7);
  app.innerHTML = '<div class="center">กำลังคำนวณ DF…</div>';
  const r = await call('dfHome', { month });
  if (!r.ok) return showError(r.error === 'not_doctor' ? 'เมนูนี้สำหรับหมอ (ให้หมอเดียร์ผูกชื่อเล่นกับชื่อหมอใน Settings → DOCTOR_STAFF)' : 'โหลดไม่ได้: ' + r.error);
  const detail = (L) => `<details><summary class="s" style="cursor:pointer">รายรับ ${L.income.length} รายการ</summary>${L.income.map(x => `<div class="s">${esc(x.date)} · ${esc(x.dn)} ${esc(x.nick)} · ${esc(x.type)} ${esc(x.treat)} · ${baht(x.amount)}</div>`).join('')}</details>
    <details><summary class="s" style="cursor:pointer">ค่าแล็บ ${L.lab.length} รายการ</summary>${L.lab.map(x => `<div class="s">${esc(x.date)} · ${esc(x.lab)} · ${esc(x.patient)} · ${baht(x.amount)}</div>`).join('') || '<div class="s">-</div>'}</details>
    <details><summary class="s" style="cursor:pointer">ค่าของ ${L.material.length} รายการ</summary>${L.material.map(x => `<div class="s">${esc(x.date)} · ${esc(x.code)} × ${esc(x.qty)} · เคส ${esc(x.caseId)} · ${baht(x.amount)}</div>`).join('') || '<div class="s">-</div>'}</details>`;
  const line = x => x.partner ? `ส่วนแบ่งเครื่องเอกซเรย์: X-ray ทั้งเดือน ${baht(x.xray)} × ${x.partnerPct}%` : `รับ ${baht(x.revenue)} − แล็บ ${baht(x.lab)} − ของ ${baht(x.material)} = ${baht(x.net)} × ${r.data?.pct ?? r.pct}%${x.xray ? ' + X-ray ' + baht(x.xray) + ' × ' + (r.data?.xpct ?? r.xpct) + '%' : ''}`;
  app.innerHTML = `<div id="m">${note ? `<div class="msg ok">${esc(note)}</div>` : ''}</div>
    <div class="card"><label for="dfM">เดือน</label><input id="dfM" type="month" value="${esc(month)}"></div>
    ${r.owner ? r.data.df.map(x => { const lg = r.log.find(l => l.doctor === x.doctor); return `<div class="card" data-doc="${esc(x.doctor)}"><div class="t">${esc(x.doctor)} · DF ${baht(x.df)} บาท</div>
      <div class="s">${line(x)}</div>${lg ? `<div class="s ${lg.status === 'ทักท้วง' ? 'bad' : ''}">สถานะ: ${esc(lg.status)}${lg.note ? ' · ' + esc(lg.note) : ''}${lg.paid ? ' · จ่าย ' + esc(lg.paid) : ''}</div>` : ''}
      ${detail(r.data.lines[x.doctor])}
      <div class="labact">${x.partner ? '' : '<button class="btn small" data-send>ส่งสรุปให้หมอตรวจ</button>'}<button class="btn ghost small" data-dpay data-amt="${x.df}">บันทึกจ่าย DF</button></div><div class="xBox"></div></div>`; }).join('')
      + `<p class="note">ขายของ ${baht(r.data.sales)} ไม่เข้า DF · X-ray รวม ${baht(r.data.xray)}${r.data.partnerPct ? ' · ส่วน ' + esc(r.data.partner) + ' ' + baht(r.data.partnerShare) : ''} · ค่าแล็บนับตามวันที่แล็บส่งงาน</p>`
    : `<div class="card"><div class="t">${esc(r.doctor)} · DF ${baht(r.df.df)} บาท</div><div class="s">${line(r.df)}</div>
      ${r.log[0] ? `<div class="s">สถานะ: ${esc(r.log[0].status)}${r.log[0].paid ? ' · จ่ายแล้ว ' + esc(r.log[0].paid) : ''}</div>` : '<div class="s">ยังไม่ได้ส่งสรุป (ตัวเลขยังเปลี่ยนได้)</div>'}
      ${detail(r.lines)}
      ${r.log[0] && r.log[0].status === 'ส่งให้ตรวจ' ? `<div class="labact"><button class="btn small" id="dfOk">ยืนยันยอดถูกต้อง</button><button class="btn ghost small" id="dfNo">ทักท้วง</button></div>` : ''}</div>`}`;
  dfM.onchange = () => viewDF('', dfM.value);
  app.querySelectorAll('[data-doc]').forEach(el => {
    const doc = el.dataset.doc, box = el.querySelector('.xBox');
    if (el.querySelector('[data-send]')) el.querySelector('[data-send]').onclick = async () => { const res = await call('dfSend', { month, doctor: doc }); if (!res.ok) return flash(errV2(res)); viewDF('ส่งสรุปให้ ' + doc + ' ทาง LINE แล้ว', month); };
    el.querySelector('[data-dpay]').onclick = e => {
      box.innerHTML = `<form><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px"><div><label>ยอดที่โอน</label><input class="a" type="number" value="${e.target.dataset.amt}"></div><div><label>วันที่</label><input class="d" type="date" value="${todayISO()}"></div></div>
        <label>สลิป</label><input class="s" type="file" accept="image/*"><button class="btn small" type="submit" style="width:100%;margin-top:6px">บันทึก</button></form>`;
      box.querySelector('form').onsubmit = async ev => { ev.preventDefault(); const f = box.querySelector('.s'); const slips = f.files.length ? await fileToData(f) : [];
        const res = await call('dfPay', { month, doctor: doc, amount: box.querySelector('.a').value, date: box.querySelector('.d').value, slips: slips || [] }); if (!res.ok) return flash(errV2(res)); viewDF('บันทึกจ่าย DF แล้ว', month); };
    };
  });
  const ok = document.getElementById('dfOk'), no = document.getElementById('dfNo');
  if (ok) ok.onclick = async () => { const res = await call('dfConfirm', { month, ok: true }); if (!res.ok) return flash(errV2(res)); viewDF('ยืนยันแล้ว', month); };
  if (no) no.onclick = async () => { const n = prompt('ทักท้วงเรื่องอะไร (เช่น เคสไหนไม่ใช่ของหมอ)'); if (!n) return; const res = await call('dfConfirm', { month, ok: false, note: n }); if (!res.ok) return flash(errV2(res)); viewDF('ส่งเรื่องให้หมอเดียร์แล้ว', month); };
}

// ---------- วันหยุด / หมอลา (อยู่ในหน้านัดหมาย) ----------
async function leaveSection(host) {
  const r = await call('leaveHome');
  if (!r.ok) { host.innerHTML = ''; return; }
  host.innerHTML = `<details class="card"><summary class="t" style="cursor:pointer">วันหยุด / หมอลา${r.list.some(l => l.status === 'รออนุมัติ') ? ' · <span class="bad">มีรออนุมัติ</span>' : ''}</summary>
    <p class="s">คลินิกปิดทุกวันพุธ · วันลาหมอขึ้นแถบแดงในปฏิทินและในหน้านี้</p>
    ${r.list.map(l => `<div class="row" style="flex-wrap:wrap"><div class="grow"><div class="t" style="color:${l.status === 'อนุมัติ' ? 'var(--bad)' : 'inherit'}">🔴 ${esc(l.kind === 'คลินิกหยุด' ? 'คลินิกหยุด' : l.doctor + ' ลา')} · ${esc(l.from)}${l.to !== l.from ? '–' + esc(l.to) : ''}</div>
      <div class="s">${esc(l.reason || '')} · ${esc(l.status)}</div></div>
      ${r.owner && l.status === 'รออนุมัติ' ? `<button class="btn small" data-ld="${esc(l.id)}" data-v="อนุมัติ">อนุมัติ</button><button class="btn ghost small" data-ld="${esc(l.id)}" data-v="ไม่อนุมัติ">ไม่อนุมัติ</button>` : ''}
      ${r.owner || l.by === me.nickname ? `<button class="btn ghost small" data-lc="${esc(l.id)}">ยกเลิก</button>` : ''}</div>`).join('') || '<p class="s">ยังไม่มี</p>'}
    ${r.canAdd ? `<form id="lvF"><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px">
      ${r.owner ? `<div><label>ประเภท</label><select id="lvK"><option value="ลา">หมอลา</option><option value="คลินิกหยุด">คลินิกหยุด</option></select></div><div><label>หมอ</label><select id="lvD">${opts(r.doctors, r.me)}</select></div>` : ''}
      <div><label>ตั้งแต่</label><input id="lvF1" type="date" required></div><div><label>ถึง</label><input id="lvT1" type="date"></div></div>
      <label>เหตุผล</label><input id="lvR"><button class="btn small" type="submit" style="width:100%;margin-top:6px">ลง${r.owner ? '' : 'วันลา (ส่งให้หมอเดียร์อนุมัติ)'}</button></form>` : ''}</details>`;
  host.querySelectorAll('[data-ld]').forEach(b => b.onclick = async () => { const res = await call('leaveDecide', { id: b.dataset.ld, decision: b.dataset.v }); if (!res.ok) return flash(errV2(res)); viewAppt('บันทึกแล้ว'); });
  host.querySelectorAll('[data-lc]').forEach(b => b.onclick = async () => { if (!confirm('ยกเลิกวันนี้?')) return; const res = await call('leaveCancel', { id: b.dataset.lc }); if (!res.ok) return flash(errV2(res)); viewAppt('ยกเลิกแล้ว'); });
  const f = document.getElementById('lvF');
  if (f) f.onsubmit = async ev => { ev.preventDefault();
    const res = await call('leaveAdd', { kind: document.getElementById('lvK')?.value || 'ลา', doctor: document.getElementById('lvD')?.value, from: lvF1.value, to: lvT1.value || lvF1.value, reason: lvR.value });
    if (!res.ok) return flash(errV2(res));
    viewAppt(res.pending ? 'ส่งขอลาให้หมอเดียร์แล้ว' : 'บันทึกแล้ว' + (res.affected ? ' · มีนัดต้องเลื่อน ' + res.affected + ' นัด (ขึ้นในงานค้างเคาน์เตอร์)' : ''));
  };
}

// ---------- ของฝากที่บริษัท (อยู่ในหน้าสต็อก) ----------
async function depSection(host) {
  const r = await call('depHome');
  if (!r.ok) { host.innerHTML = ''; return; }
  host.innerHTML = `<details class="card"><summary class="t" style="cursor:pointer">📦 ของฝากที่บริษัท (${r.accounts.length})</summary>
    ${r.accounts.map(a => `<div class="card" style="padding:10px" data-acc="${esc(a.id)}"><div class="t">${esc(a.vendor)} · ${esc(a.name)}</div>
      <div class="s">${a.type === 'เครดิต' ? (r.owner ? 'คงค้างที่บริษัท ' + baht(a.balance) + ' บาท (จาก ' + baht(a.start) + ')' : 'เครดิตเงิน') : 'นับเป็นชิ้น'}${a.expire ? ' · หมดเขตเบิก ' + esc(a.expire) : ''}</div>
      <div class="s">เบิกมาแล้ว ${a.totOut} ชิ้น${a.totUnused != null ? ' · ยังไม่ใช้ ' + a.totUnused + ' · ใช้แล้ว ' + (a.totOut - a.totUnused) : ' · ยังนับไม่ครบ'}</div>
      <div style="overflow-x:auto"><table style="width:100%;font-size:13px;border-collapse:collapse;margin-top:6px">
        <tr style="text-align:left;color:var(--muted)"><th>รหัส</th><th>เบิก</th><th>ใช้แล้ว</th><th>ยังไม่ใช้</th><th>${a.type === 'ชิ้น' ? 'คงค้าง' : 'วันหมดอายุ (ยังไม่ใช้)'}</th><th>นับในคลินิก</th></tr>
        ${a.items.map(it => `<tr style="border-top:1px solid var(--border)"><td>${esc(it.code || it.desc)}</td><td>${it.out}</td><td>${it.usedQty ?? '?'}</td>
          <td class="${it.expired ? 'bad' : it.expSoon ? 'warn' : ''}">${it.unused ?? '?'}${it.expired ? ' (หมดอายุ ' + it.expired + ')' : ''}</td>
          <td>${a.type === 'ชิ้น' ? it.left : esc((it.unusedLots || []).map(l => l.exp + '×' + l.qty).join(' ') || '-')}</td>
          <td>${it.out ? `<input class="dc" data-code="${esc(it.code)}" type="number" min="0" max="${it.out}" value="${it.counted ?? ''}" style="width:64px;height:32px">` : ''}</td></tr>`).join('')}</table></div>
      ${a.items.some(it => it.out) ? '<button type="button" class="btn ghost small dcSave" style="width:100%;margin-top:6px">บันทึกจำนวนที่นับ (ของฝากที่ยังไม่ใช้ในคลินิก)</button>' : ''}</div>`).join('') || '<p class="s">ยังไม่มี</p>'}
    ${r.accounts.length ? `<form id="dmF"><div class="t" style="margin-top:8px">ของมาถึงแล้ว → เบิกจากของฝาก</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px"><div><label>ชุดของฝาก</label><select id="dmA">${r.accounts.map(a => `<option value="${esc(a.id)}">${esc(a.vendor)} · ${esc(a.name)}</option>`).join('')}</select></div>
        <div><label>เลขใบส่งของ</label><input id="dmN"></div></div>
      <div id="dmRows"></div><button type="button" class="btn ghost small" id="dmAdd">+ รายการ</button>
      <button class="btn small" type="submit" style="width:100%;margin-top:6px">บันทึกเบิก (เข้าสต็อกให้เอง)</button></form>` : ''}
    ${r.owner ? `<form id="daF"><div class="t" style="margin-top:8px">เพิ่มชุดของฝาก</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px">
      <div><label>บริษัท</label><input id="daV" required></div><div><label>ชื่อชุด</label><input id="daN" required placeholder="Package 695,000"></div>
      <div><label>ประเภท</label><select id="daT"><option value="เครดิต">เครดิตเงิน</option><option value="ชิ้น">นับเป็นชิ้น</option></select></div><div><label>ยอดตั้งต้น (บาท)</label><input id="daS" type="number"></div>
      <div><label>หมดเขตเบิก</label><input id="daE" type="date"></div></div><button class="btn ghost small" type="submit" style="width:100%;margin-top:6px">เพิ่ม</button></form>` : ''}</details>`;
  const row = () => `<div class="dmRow" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 6px;margin:4px 0;border-top:1px solid var(--border);padding-top:4px">
    <input class="c" placeholder="รหัสสินค้าบริษัท"><input class="x" type="month" title="วันหมดอายุ"><input class="q" type="number" placeholder="จำนวน">
    <input class="p" type="number" placeholder="ราคา/หน่วย"><select class="s" style="grid-column:span 2"><option value="">เข้าสต็อกรหัส…</option>${r.stock.map(s => `<option value="${esc(s.code)}">${esc(s.code)} ${esc(s.name)}</option>`).join('')}</select></div>`;
  const add = document.getElementById('dmAdd');
  if (add) { const rows = document.getElementById('dmRows'); rows.innerHTML = row(); add.onclick = () => rows.insertAdjacentHTML('beforeend', row());
    dmF.onsubmit = async ev => { ev.preventDefault();
      const items = [...host.querySelectorAll('.dmRow')].map(x => ({ code: x.querySelector('.c').value, desc: x.querySelector('.c').value, exp: x.querySelector('.x').value, qty: x.querySelector('.q').value, price: x.querySelector('.p').value, stockCode: x.querySelector('.s').value }));
      const res = await call('depMove', { account: dmA.value, kind: 'เบิก', docNo: dmN.value, items }); if (!res.ok) return flash(errV2(res)); viewStock(); flash('บันทึกเบิกแล้ว ของเข้าสต็อกแล้ว', true); }; }
  host.querySelectorAll('[data-acc]').forEach(el => { const b = el.querySelector('.dcSave'); if (!b) return; b.onclick = async () => {
    const items = [...el.querySelectorAll('.dc')].filter(x => x.value !== '').map(x => ({ code: x.dataset.code, qty: x.value }));
    if (!items.length) return flash('ใส่จำนวนที่นับได้');
    const res = await call('depCount', { account: el.dataset.acc, items }); if (!res.ok) return flash(errV2(res)); viewStock(); flash('บันทึกจำนวนที่นับแล้ว', true); }; });
  const da = document.getElementById('daF');
  if (da) da.onsubmit = async ev => { ev.preventDefault(); const res = await call('depAccountAdd', { vendor: daV.value, name: daN.value, type: daT.value, start: daS.value, expire: daE.value }); if (!res.ok) return flash(errV2(res)); viewStock(); flash('เพิ่มแล้ว', true); };
}

function toM(h) { const [a, b] = String(h).split(':').map(Number); return a * 60 + (b || 0); }

start();
</script>
</body>
</html>
