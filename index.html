<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>เมนูทีม SMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--bg:#F2F5F6;--card:#FFFFFF;--ink:#1B2A2E;--muted:#4D5F64;--line:#E2E8EA;--border:#C9D4D8;--accent:#0F6E6A;--soft:#E1F2EF;--deep:#0B5552;--warn:#A4520E;--warnbg:#FCEBDD;--bad:#8C1D18;--badbg:#FBE3E1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px}
header h1{margin:0;font-size:17px;font-weight:600}
header .who{font-size:12px;color:var(--muted)}
nav{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto}
nav button{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--border);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
main{padding:12px 16px 32px;display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:12px 14px}
.list{background:var(--card);border-radius:12px;padding:0 14px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.t{font-weight:600}
.s{font-size:12px;color:var(--muted)}
.s.warn{color:var(--warn);font-weight:600}
.s.bad{color:var(--bad);font-weight:600}
span.bad{color:var(--bad)}
.pill{font-size:12px;padding:3px 10px;border-radius:10px;background:var(--soft);color:var(--deep);white-space:normal;overflow-wrap:anywhere;max-width:100%}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:none;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--border);font-weight:400}
.btn.small{min-height:40px;font-size:13px}
.btn:disabled{opacity:.5}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card);padding:0 12px;font:inherit;color:var(--ink)}
.note{font-size:12px;color:var(--muted)}
.msg{padding:10px 12px;border-radius:10px;font-size:14px}
.msg.ok{background:var(--soft);color:var(--deep)}
.msg.err{background:var(--badbg);color:var(--bad)}
.center{text-align:center;padding:40px 16px;color:var(--muted)}
.move{display:flex;gap:6px;align-items:flex-end;margin-top:8px}
.labcard{display:flex;flex-direction:column;gap:2px}
.labact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
details.card summary{list-style:none}
details.card summary::-webkit-details-marker{display:none}
a{color:var(--accent)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--border);background:var(--card);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.move input{height:40px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1 id="title">เมนูทีม SMA</h1><div class="who" id="who">กำลังโหลด…</div></header>
<nav id="tabs" hidden aria-label="เมนู">
  <button data-tab="tasks">งานของฉัน</button>
  <button data-tab="checklist">งานค้าง</button>
  <button data-tab="appt">นัดหมาย</button>
  <button data-tab="cases">เคส</button>
  <button data-tab="stock">สต็อก</button>
  <button data-tab="lab">แล็บ</button>
  <button data-tab="buy">ซื้อของ</button>
  <button data-tab="cap">📷 ถ่ายเอกสาร</button>
  <button data-tab="daily">สรุปรายวัน</button>
  <button data-tab="pay" data-owner>เจ้าหนี้</button>
  <button data-tab="df" data-doctor>DF</button>
  <button data-tab="team">ทีมงาน</button>
</nav>
<main id="app"><div class="center">กำลังเชื่อมต่อ LINE…</div></main>

<script>
const LIFF_ID = '2012153326-d5iUzPP3';
const API_URL = 'https://script.google.com/macros/s/AKfycbyFN3RzgA2ZQp1l_cTcCMc4qG1XwgeWvsmSHBVmR2uwl4zQ8wkFvdEdCMLR0_19tVdg/exec';

const app = document.getElementById('app');
const who = document.getElementById('who');
const tabs = document.getElementById('tabs');
let me = null, profile = null, stockItems = [];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = v => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleDateString('th-TH', {day:'numeric', month:'short'}); };

// ข้อมูลที่เปิดดูบ่อย: โชว์ของเดิมที่จำไว้ทันที แล้วดึงของใหม่ตามหลัง (ถ้าต่างและยังไม่ได้พิมพ์อะไร → วาดหน้าใหม่)
const READ_ACTIONS = new Set(['stockTree', 'dailyToday', 'apptDay', 'checklist', 'buyHome', 'stock', 'caseList', 'labs', 'myTasks', 'today', 'myRequests', 'pending',
  'teamList', 'payHome', 'myCases', 'caseInfo', 'leaveHome', 'capHome', 'dfHome', 'reserved', 'myLabSteps', 'patients', 'tasksHome', 'patientInfo']);
const memGet = k => { try { return JSON.parse(localStorage.getItem('sma_c_' + k) || 'null'); } catch (e) { return null; } };
const memSet = (k, v) => { try { localStorage.setItem('sma_c_' + k, JSON.stringify(v)); } catch (e) {} };
const memClear = () => { try { Object.keys(localStorage).filter(k => k.startsWith('sma_c_')).forEach(k => localStorage.removeItem(k)); } catch (e) {} };
let dirty = false;
document.addEventListener('input', () => { dirty = true; }, true);
const inFlight = new Map();
// ปุ่มคัดลอกทางไปโฟลเดอร์รูป (ใช้กับแอป DS file)
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); flash('คัดลอก ' + b.dataset.copy + ' แล้ว เปิด DS file แล้ววางในช่องค้นหา/ไปที่โฟลเดอร์', true); }
  catch (err) { prompt('คัดลอกทางไปโฟลเดอร์นี้', b.dataset.copy); }
});
async function api(action, data = {}) {
  if (!READ_ACTIONS.has(action)) {
    // กันกดซ้ำ: คำขอเดิมที่ยังส่งไม่เสร็จ → ใช้ผลเดียวกัน ไม่ส่งซ้ำ
    const fk = action + '|' + JSON.stringify(data).slice(0, 2000);
    if (inFlight.has(fk)) return inFlight.get(fk);
    const p = apiNet(action, data).finally(() => inFlight.delete(fk));
    inFlight.set(fk, p);
    const r = await p;
    if (r && r.ok && action !== 'me') memClear();
    return r;
  }
  const key = (me ? me.nickname : '') + '|' + action + '|' + JSON.stringify(data);
  const cached = memGet(key);
  const fresh = apiNet(action, data).then(r => { if (r && r.ok) memSet(key, r); return r; });
  if (!cached) return fresh;
  const hashAt = location.hash;
  fresh.then(r => {
    if (r && r.ok && JSON.stringify(r) !== JSON.stringify(cached) && location.hash === hashAt && !dirty) route(true);
  }).catch(() => {});
  return cached;
}
// อ่านข้อมูล: ช้า/หลุด → ลองใหม่ให้เองอีก 1 ครั้ง (บันทึก/แก้ไข ไม่ลองซ้ำ กันข้อมูลเข้า 2 ครั้ง)
async function apiNet(action, data = {}) {
  try { return await apiOnce(action, data); }
  catch (e) {
    if (!READ_ACTIONS.has(action)) throw e;
    return await apiOnce(action, data);
  }
}
async function apiOnce(action, data = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 40000);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action, idToken: liff.getIDToken(), ...data}),
      signal: ctrl.signal
    });
    return await res.json();
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'ระบบตอบช้าเกินไป ลองใหม่อีกครั้ง' : e.message);
  } finally {
    clearTimeout(timer);
  }
}

function showError(text) {
  app.innerHTML = `<div class="msg err">${esc(text)}</div><button class="btn ghost" onclick="location.reload()">ลองใหม่</button>`;
}

// ปุ่มริชเมนู: liff.line.me/ID?page=cases → LINE ส่งมาเป็น ?page= หรือ ?liff.state=%3Fpage%3Dcases (หรือ #cases)
function pageFromUrl() {
  const sp = new URLSearchParams(location.search);
  let p = sp.get('page');
  const st = sp.get('liff.state');
  if (!p && st) { const m = st.match(/[?&]page=([\w-]+)/) || st.match(/#([\w-]+)/) || st.match(/^\/?([\w-]+)$/); p = m && m[1]; }
  if (!p && location.hash) p = location.hash.slice(1);
  return p || '';
}
let START_PAGE = pageFromUrl();
async function start() {
  try {
    await liff.init({liffId: LIFF_ID});
    START_PAGE = pageFromUrl() || START_PAGE;
    if (!liff.isLoggedIn()) { liff.login({redirectUri: location.href}); return; }
    profile = await liff.getProfile().catch(() => null);
    app.innerHTML = '<div class="center">กำลังตรวจสอบสิทธิ์…</div>';
    const meKey = 'sma_me_' + (profile ? profile.userId : '');
    let saved = null; try { saved = JSON.parse(localStorage.getItem(meKey) || 'null'); } catch (e) {}
    if (saved) {
      // เคยเข้าแล้ว: เปิดเมนูทันที แล้วตรวจสิทธิ์ตามหลัง
      me = saved; enter();
      api('me').then(r => {
        if (r.ok) { me = r.staff; try { localStorage.setItem(meKey, JSON.stringify(r.staff)); } catch (e) {} return; }
        try { localStorage.removeItem(meKey); } catch (e) {}
        location.reload();
      }).catch(() => {});
      return;
    }
    const r = await api('me');
    if (r.ok) { me = r.staff; try { localStorage.setItem(meKey, JSON.stringify(r.staff)); } catch (e) {} return enter(); }
    if (r.error === 'not_approved' && r.staff && r.staff.status === 'รออนุมัติ') return waiting();
    if (r.error === 'not_approved' && r.staff && r.staff.status === 'ระงับ') { who.textContent = ''; return showError('บัญชีนี้ถูกระงับสิทธิ์ ติดต่อเจ้าของคลินิก'); }
    if (r.error === 'not_approved') return registerForm();
    if (r.error === 'invalid_token') { who.textContent = ''; return showError('ยืนยันตัวตนกับ LINE ไม่ผ่าน ให้ตรวจ LOGIN_CHANNEL_ID ใน Apps Script'); }
    showError('เชื่อมต่อระบบไม่ได้ (' + (r.error || 'ไม่ทราบสาเหตุ') + ')');
  } catch (e) {
    showError('เชื่อมต่อไม่สำเร็จ: ' + e.message);
  }
}

function registerForm() {
  who.textContent = 'ลงทะเบียนครั้งแรก';
  app.innerHTML = `
  <div class="card">
    <div class="t">ลงทะเบียนพนักงาน</div>
    <p class="note">กรอกครั้งเดียว เจ้าของคลินิกอนุมัติแล้วจะใช้เมนูได้</p>
    <form id="reg">
      <label for="nick">ชื่อเล่น</label>
      <input id="nick" required value="${esc(profile?.displayName || '')}">
      <label for="full">ชื่อจริง นามสกุล</label>
      <input id="full" required>
      <label for="pos">ตำแหน่ง</label>
      <select id="pos" required>
        <option value="">เลือกตำแหน่ง</option>
        <option>ทันตแพทย์</option><option>เคาน์เตอร์</option><option>ผู้ช่วยทันตแพทย์</option><option>ช่างแล็บ</option><option>ดีไซเนอร์</option>
        <option>ถ่ายภาพ</option><option>แม่บ้าน</option><option>อื่นๆ</option>
      </select>
      <div style="margin-top:14px"><button class="btn" style="width:100%" type="submit">ส่งลงทะเบียน</button></div>
    </form>
  </div>`;
  document.getElementById('reg').onsubmit = async ev => {
    ev.preventDefault();
    const b = ev.target.querySelector('button'); b.disabled = true; b.textContent = 'กำลังส่ง…';
    const r = await api('register', {
      nickname: document.getElementById('nick').value.trim(),
      fullname: document.getElementById('full').value.trim(),
      position: document.getElementById('pos').value
    }).catch(e => ({ok:false, error:e.message}));
    if (r.ok) waiting(); else { b.disabled = false; b.textContent = 'ส่งลงทะเบียน'; alertBox('ส่งไม่สำเร็จ: ' + r.error); }
  };
}

function alertBox(text) {
  const d = document.createElement('div'); d.className = 'msg err'; d.textContent = text; app.prepend(d);
}

function waiting() {
  who.textContent = 'รออนุมัติ';
  app.innerHTML = `<div class="card center"><div class="t" style="color:var(--ink)">ส่งลงทะเบียนแล้ว</div><p>รอเจ้าของคลินิกอนุมัติ อนุมัติแล้วกดเมนูใหม่อีกครั้ง</p></div>`;
}

function enter() {
  who.textContent = `${me.nickname} · ${me.position}`;
  tabs.hidden = false;
  tabs.querySelectorAll('[data-owner]').forEach(b => b.hidden = me.role !== 'owner');
  tabs.querySelectorAll('[data-doctor]').forEach(b => b.hidden = !(me.role === 'owner' || me.position === 'ทันตแพทย์'));
  tabs.querySelectorAll('button').forEach(b => b.onclick = () => { location.hash = b.dataset.tab; });
  if (START_PAGE && location.hash.slice(1) !== START_PAGE) { try { history.replaceState(null, '', location.pathname + '#' + START_PAGE); } catch (e) { location.hash = START_PAGE; } }
  START_PAGE = '';
  window.onhashchange = () => route();
  route();
}

function route(refresh) {
  if (!refresh) dirty = false;
  const tab = (location.hash ? location.hash.slice(1) : pageFromUrl()) || 'tasks';
  tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab));
  const page = tab === 'schedule' ? 'cases' : tab;
  tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === page));
  ({tasks: viewTasks, stock: viewStock, team: viewTeam, cases: viewCases2, lab: viewLab, buy: viewBuy, daily: () => viewDaily2(), checklist: viewChecklist, appt: () => viewAppt(), cap: () => viewCapture(), pay: () => viewPay(), df: () => viewDF()}[page] || soon)(page);
}

// ===== ทีมงาน: ลงเวลา / ขอโอที / ลา =====
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('เครื่องนี้หาตำแหน่งไม่ได้'));
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy)}),
      e => reject(new Error(e.code === 1 ? 'ยังไม่ได้อนุญาตให้ LINE ใช้ตำแหน่ง ไปเปิดในตั้งค่าเครื่องแล้วลองใหม่' : 'หาตำแหน่งไม่ได้ ลองออกไปใกล้หน้าต่างแล้วกดใหม่')),
      {enableHighAccuracy: true, timeout: 15000, maximumAge: 0});
  });
}

const errText = r => ({
  too_far: `อยู่ห่างคลินิก ${r.dist} เมตร ต้องอยู่ที่คลินิกจึงจะลงเวลาได้`,
  already_in: 'ลงเวลาเข้างานวันนี้ไปแล้ว',
  not_in: 'ยังไม่ได้ลงเวลาเข้างานวันนี้',
  already_out: 'ลงเวลาออกงานวันนี้ไปแล้ว',
  no_location: 'ไม่ได้รับตำแหน่ง ลองใหม่อีกครั้ง',
  missing_fields: 'กรอกวันที่และสาเหตุให้ครบ',
  not_day_off: 'วันที่เลือกไม่ใช่วันหยุดของคลินิก'
}[r.error] || ('ทำรายการไม่สำเร็จ: ' + r.error));

async function viewTeam() {
  app.innerHTML = '<div class="center">กำลังโหลด…</div>';
  const calls = [api('today'), api('myRequests')];
  if (me.role === 'owner') calls.push(api('pending'));
  const [t, q, p] = await Promise.all(calls).catch(e => [{ok:false, error:e.message}]);
  if (!t || !t.ok) return showError('โหลดข้อมูลไม่ได้: ' + (t && t.error));
  const s = t.settings, rec = t.record;
  const today = new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Bangkok'});

  let clock;
  if (!rec) clock = `<button class="btn" id="cin" style="width:100%;min-height:56px;font-size:16px">ลงเวลาเข้างาน</button>`;
  else if (!rec.out) clock = `<div class="row"><div class="grow"><div class="t">เข้างาน ${esc(rec.in)}</div><div class="s ${Number(rec.late) ? 'warn' : ''}">${Number(rec.late) ? 'สาย ' + esc(rec.late) + ' นาที · ' + esc(rec.reason) : 'ตรงเวลา'}</div></div></div>
      <button class="btn" id="cout" style="width:100%;min-height:56px;font-size:16px">ลงเวลาออกงาน</button>`;
  else clock = `<div class="row"><div class="grow"><div class="t">เข้า ${esc(rec.in)} · ออก ${esc(rec.out)}</div><div class="s">ลงเวลาวันนี้ครบแล้ว</div></div><span class="pill">ครบ</span></div>`;

  const reqRows = (q && q.ok && q.requests.length) ? q.requests.map(x => `<div class="row"><div class="grow">
      <div class="t">${esc(x.type)} · ${esc(x.date)}${x.dateTo && x.dateTo !== x.date ? ' ถึง ' + esc(x.dateTo) : ''}${x.start ? ' ' + esc(x.start) + '–' + esc(x.end) : ''}${x.place ? ' · ที่' + esc(x.place) : ''}</div>
      <div class="s">${esc(x.reason)}</div></div><span class="pill" style="${x.status === 'ไม่อนุมัติ' ? 'background:var(--badbg);color:var(--bad)' : x.status === 'รออนุมัติ' ? 'background:var(--warnbg);color:var(--warn)' : ''}">${esc(x.status)}</span></div>`).join('')
    : '<div class="row s">ยังไม่มีคำขอ</div>';

  const pendRows = (p && p.ok) ? (p.requests.length ? p.requests.map(x => `<div class="row" style="flex-wrap:wrap"><div class="grow">
      <div class="t">${esc(x.nickname)} · ${esc(x.type)}</div>
      <div class="s">${esc(x.date)}${x.dateTo && x.dateTo !== x.date ? ' ถึง ' + esc(x.dateTo) : ''}${x.start ? ' ' + esc(x.start) + '–' + esc(x.end) : ''}${x.place ? ' · ที่' + esc(x.place) : ''} · ${esc(x.reason)}</div></div>
      <button class="btn small" data-id="${esc(x.id)}" data-d="อนุมัติ">อนุมัติ</button>
      <button class="btn ghost small" data-id="${esc(x.id)}" data-d="ไม่อนุมัติ">ไม่อนุมัติ</button></div>`).join('')
    : '<div class="row s">ไม่มีคำขอรออนุมัติ</div>') : '';

  let offBox = '';
  if (t.dayOff && rec && !t.hasHolidayReq) offBox = `<div class="msg err">วันนี้${esc(t.dayOff)} ลงเวลาไว้แล้ว อย่าลืมส่งคำขอ "ทำงานวันหยุด" ให้หมออนุมัติ <button class="btn small" id="goHol" type="button" style="margin-top:8px;width:100%">ส่งคำขอทำงานวันหยุดของวันนี้</button></div>`;
  else if (t.dayOff) offBox = `<div class="msg ok">วันนี้${esc(t.dayOff)} ลงเวลาได้ ไม่นับสาย${t.hasHolidayReq ? ' · ส่งคำขอทำงานวันหยุดแล้ว' : ''}</div>`;

  app.innerHTML = `
    <div id="m"></div>
    ${offBox}

  document.getElementById('rq').onsubmit = async ev => {

    const send = extra => api('request', {...payload(), ...extra}).catch(e => ({ok:false, error:e.message}));
    let r = await send({});
    if (!r.ok && r.error === 'not_day_off') {
      if (confirm('วันที่เลือกไม่ใช่วันหยุดของคลินิก ยืนยันส่งเป็น "ทำงานวันหยุด" ใช่ไหม')) r = await send({confirmNotOff: true});

  function payload() {
    const kind = typeSel.value, ot = kind === 'โอที', leave = kind.startsWith('ลา');

      : '<p class="s">ยังไม่มีพนักงานที่อนุมัติแล้ว</p>';

  app.querySelectorAll('#pend button[data-id]').forEach(b => b.onclick = async () => {

    if (r.ok) return viewTeam().then(() => msg(b.dataset.d === 'อนุมัติ' ? 'อนุมัติแล้ว' : 'ไม่อนุมัติแล้ว', true));
    b.disabled = false; msg(errText(r));
  });
}

async function viewStock() {

  const r = await call('stockTree');
  if (!r.ok) return showError('โหลดสต็อกไม่ได้: ' + r.error);
  stockItems = r.items; stockGroups = r.groups || []; stockUnits = r.units || ['ชิ้น'];
  stockReserved = r.reserved || {};
  renderStock('');
  const host = document.createElement('div'); host.id = 'depHost'; app.appendChild(host); depSection(host);
}

let stockCat = 'ทั้งหมด', stockReserved = {}, stockPath = [], stockGroups = [], stockUnits = [], stockEdit = '';
const SEP = ' › ';
// สต็อกเป็นชั้น v18: เส้นทางยืดหยุ่น (งาน › วัสดุ/อุปกรณ์ › หมวด › ยี่ห้อ › …) · กด + เพิ่มได้ทุกชั้น
const JOB_ORDER = ['งานศัลยกรรม', 'งานอุดฟัน / ความงาม', 'งานครอบ / สะพาน / วีเนียร์', 'งานรักษาราก', 'งานจัดฟัน', 'งานฟันปลอมถอดได้', 'แล็บ', 'ใช้ร่วมทุกงาน', 'ของขาย', 'ยังไม่จัดหมวด'];
function stockState(i) {
  const held = stockReserved[i['รหัสสินค้า']] || 0;
  const left = Number(i['คงเหลือ']) - held, hasReorder = String(i['จุดสั่งซื้อ']).trim() !== '', reorder = Number(i['จุดสั่งซื้อ']);
  const exp = i['วันหมดอายุใกล้สุด'] ? new Date(i['วันหมดอายุใกล้สุด']) : null;
  const soon30 = new Date(); soon30.setDate(soon30.getDate() + 30);
  return {held, left, hasReorder, exp, expSoon: !!(exp && !isNaN(exp) && exp <= soon30), low: hasReorder ? left <= reorder : left <= 0};
}
function allGroupPaths() {
  const set = new Set();
  const addP = p => { const parts = p.split(SEP); for (let k = 1; k <= parts.length; k++) set.add(parts.slice(0, k).join(SEP)); };
  stockItems.forEach(i => i.path && addP(i.path)); stockGroups.forEach(addP);
  return [...set].sort((a, b) => a.localeCompare(b, 'th'));
}
function renderStock(q) {
  const P = stockPath, cur = P.join(SEP);
  const fmtUp = u => u ? 'อัปเดต ' + fmtDate(String(u).slice(0, 10)) : '';
  const row = i => {
    const st = stockState(i), code = esc(i['รหัสสินค้า']);
    const sub = st.expSoon ? `<span class="s bad">หมดอายุ ${fmtDate(st.exp)} · เหลือ ${esc(i['คงเหลือ'])} ${esc(i['หน่วย'])}</span>` :
      `<span class="s ${st.low ? 'warn' : ''}">เหลือ ${esc(i['คงเหลือ'])} ${esc(i['หน่วย'])}${st.held ? ' · จองแล้ว ' + st.held + ' · ว่าง ' + st.left : ''}${st.hasReorder ? ' · จุดสั่ง ' + esc(i['จุดสั่งซื้อ']) : ''}</span>`;
    const edit = stockEdit === 'i:' + i['รหัสสินค้า'] ? `<form class="ied" style="width:100%" data-ic="${code}">
        <label>ชื่อ</label><input name="name" value="${esc(i['ชื่อสินค้า'])}">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px"><div><label>หน่วย</label><select name="unit">${[...new Set([i['หน่วย'], ...stockUnits])].filter(Boolean).map(u => `<option${u === i['หน่วย'] ? ' selected' : ''}>${esc(u)}</option>`).join('')}</select></div>
        <div><label>จุดสั่งซื้อ</label><input name="reorder" type="number" value="${esc(i['จุดสั่งซื้อ'])}"></div></div>
        <label>อยู่กลุ่ม (ย้ายได้)</label><select name="path">${allGroupPaths().map(p => `<option${p === i.path ? ' selected' : ''}>${esc(p)}</option>`).join('')}</select>
        <label>ผู้ขาย</label><input name="vendor" value="${esc(i['ผู้ขาย'] || '')}">
        <div style="display:flex;gap:8px;margin-top:8px"><button class="btn small" type="submit" style="flex:1">บันทึก</button><button class="btn ghost small" type="button" data-cancel>ยกเลิก</button></div></form>` : '';
    return `<div class="row" style="flex-wrap:wrap"><div class="grow"><div class="t">${esc(i['ชื่อสินค้า'])}</div>${q ? `<div class="s" style="font-size:12px">${esc(i.path)}</div>` : ''}${sub}
      <div class="s" style="font-size:11px">${fmtUp(i.updated)}</div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;width:100%;justify-content:flex-end"><button class="btn ghost small" data-iedit="${code}" aria-label="แก้">✎</button>
      <button class="btn ghost small" data-count="${code}">นับ</button>
      <button class="btn ghost small" data-tobuy="${code}" aria-label="ใส่รายการต้องซื้อ">+ซื้อ</button>
      <button class="btn ghost small" data-code="${code}" data-type="เบิก">เบิก</button>
      <button class="btn small" data-code="${code}" data-type="รับเข้า">รับเข้า</button></div>${edit}</div>`;
  };
  const under = p => stockItems.filter(i => i.path === p || i.path.startsWith(p + SEP));
  const tile = (name) => {
    const p = cur ? cur + SEP + name : name, list = under(p);
    const low = list.filter(i => stockState(i).low).length, exp = list.filter(i => stockState(i).expSoon).length;
    const ed = stockEdit === 'g:' + p ? `<form class="ged" data-gp="${esc(p)}" style="width:100%"><label>ชื่อกลุ่ม</label><input name="name" value="${esc(name)}">
      <label>อยู่ใต้</label><select name="parent"><option value="">(ชั้นบนสุด)</option>${allGroupPaths().filter(x => x !== p && !x.startsWith(p + SEP)).map(x => `<option${x === cur ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="btn small" type="submit" style="flex:1">บันทึก</button><button class="btn ghost small" type="button" data-cancel>ยกเลิก</button></div></form>` : '';
    return `<div class="row" style="flex-wrap:wrap"><div class="grow" data-go="${esc(name)}" style="cursor:pointer"><div class="t">${esc(name)}</div>
      <div class="s">${list.length} รายการ${low ? ` · <span class="warn">ใกล้หมด ${low}</span>` : ''}${exp ? ` · <span class="bad">ใกล้หมดอายุ ${exp}</span>` : ''}</div></div>
      <button class="btn ghost small" data-gedit="${esc(p)}" aria-label="แก้ชื่อหรือย้ายกลุ่ม">✎</button><span class="s" data-go="${esc(name)}" style="cursor:pointer;padding:0 6px">›</span>${ed}</div>`;
  };
  let crumbs = '', body = '';
  if (q) {
    const ql = q.toLowerCase();
    const items = stockItems.filter(i => [i['ชื่อสินค้า'], i['รหัสสินค้า'], i.path].some(x => String(x).toLowerCase().includes(ql)));
    body = items.length ? `<div class="list">${items.map(row).join('')}</div>` : '<div class="card s">ไม่พบรายการ</div>';
  } else {
    const kids = new Set();
    allGroupPaths().forEach(p => { if (cur ? p.startsWith(cur + SEP) && p.split(SEP).length === P.length + 1 : p.split(SEP).length === 1) kids.add(p.split(SEP).pop()); });
    const order = P.length === 0 ? JOB_ORDER : P.length === 1 ? ['วัสดุ', 'อุปกรณ์'] : [];
    const kidList = [...kids].sort((a, b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, 'th'); });
    const here = stockItems.filter(i => i.path === cur);
    crumbs = `<div class="cats" style="margin:8px 0;align-items:center;flex-wrap:wrap;overflow:visible"><button type="button" data-up="0" aria-pressed="${!P.length}">ทุกงาน</button>${P.map((x, k) => `<button type="button" data-up="${k + 1}" aria-pressed="${k === P.length - 1}">${esc(x)}</button>`).join('')}<button type="button" id="plus" aria-label="เพิ่มในชั้นนี้" style="font-weight:700">＋</button></div>
      <div id="addBox"></div>`;
    body = (kidList.length ? `<div class="list">${kidList.map(tile).join('')}</div>` : '') + (here.length ? `<div class="list">${here.map(row).join('')}</div>` : '')
      + (!kidList.length && !here.length ? '<div class="card s">ยังไม่มีของในกลุ่มนี้ · กด ＋ เพื่อเพิ่ม</div>' : '');
  }
  const dep = document.getElementById('depHost');
  app.innerHTML = `
    <div><label for="q">ค้นหาวัสดุ</label><input id="q" type="search" value="${esc(q)}" placeholder="ชื่อ รหัส ยี่ห้อ หรือกลุ่ม"></div>
    <div id="m"></div>${crumbs}${body}`;
  if (dep) app.appendChild(dep);
  const qi = document.getElementById('q');
  qi.oninput = () => { const v = qi.value; renderStock(v); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(v.length, v.length); };
  app.querySelectorAll('[data-go]').forEach(el => el.onclick = () => { stockPath = [...P, el.dataset.go]; stockEdit = ''; renderStock(''); scrollTo(0, 0); });
  app.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { stockPath = P.slice(0, +b.dataset.up); stockEdit = ''; renderStock(''); });
  app.querySelectorAll('button[data-code]').forEach(b => b.onclick = () => moveForm(b));
  app.querySelectorAll('[data-tobuy]').forEach(b => b.onclick = () => toBuyQuick(b));
  app.querySelectorAll('[data-iedit]').forEach(b => b.onclick = () => { stockEdit = stockEdit === 'i:' + b.dataset.iedit ? '' : 'i:' + b.dataset.iedit; renderStock(q); });
  app.querySelectorAll('[data-gedit]').forEach(b => b.onclick = () => { stockEdit = stockEdit === 'g:' + b.dataset.gedit ? '' : 'g:' + b.dataset.gedit; renderStock(q); });
  app.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { stockEdit = ''; renderStock(q); });
  app.querySelectorAll('[data-count]').forEach(b => b.onclick = async () => {
    const it = stockItems.find(i => i['รหัสสินค้า'] === b.dataset.count) || {};
    const n = prompt('นับได้จริงกี่ ' + (it['หน่วย'] || '') + ' (ในระบบ ' + it['คงเหลือ'] + ')', it['คงเหลือ']);
    if (n === null || n.trim() === '' || isNaN(Number(n))) return;
    b.disabled = true;
    const res = await call('stockMove', {code: it['รหัสสินค้า'], type: 'นับ', qty: Number(n), note: 'นับจริง (เดิม ' + it['คงเหลือ'] + ')'});
    if (!res.ok) { b.disabled = false; return flash(errMore(res)); }
    it['คงเหลือ'] = res.left; it.updated = new Date().toLocaleString('sv-SE').slice(0, 16);
    renderStock(q); flash('บันทึกยอดนับแล้ว: ' + it['ชื่อสินค้า'] + ' = ' + res.left, true);
  });
  app.querySelectorAll('form.ied').forEach(f => f.onsubmit = async ev => {
    ev.preventDefault(); const d = Object.fromEntries(new FormData(f)); const code = f.dataset.ic;
    const res = await call('stockItemEdit', {code, ...d}); if (!res.ok) return flash(errMore(res));
    const it = stockItems.find(i => i['รหัสสินค้า'] === code);
    Object.assign(it, {'ชื่อสินค้า': d.name, 'หน่วย': d.unit, 'จุดสั่งซื้อ': d.reorder, 'ผู้ขาย': d.vendor, path: d.path}); it.updated = new Date().toLocaleString('sv-SE').slice(0, 16);
    stockEdit = ''; renderStock(q); flash('บันทึกแล้ว', true);
  });
  app.querySelectorAll('form.ged').forEach(f => f.onsubmit = async ev => {
    ev.preventDefault(); const d = Object.fromEntries(new FormData(f)); const from = f.dataset.gp;
    const name = d.name.replace(/›/g, '').trim(); if (!name) return flash('ใส่ชื่อกลุ่ม');
    const to = (d.parent ? d.parent + SEP : '') + name;

// ===== รูปถ่าย: ย่อให้เล็กก่อนส่ง =====
// ย่อรูปก่อนส่ง · ถ้าเบราว์เซอร์ใน LINE อ่านรูปไม่ได้ (เช่น HEIC) หรือค้าง → ส่งไฟล์เดิมแทน ไม่ให้ปุ่มค้าง
function readRaw(file) {
  return new Promise((resolve, reject) => {
    if (file.size > 8 * 1024 * 1024) return reject(new Error('รูปใหญ่เกินไป ลองแคปหน้าจอสลิปแล้วแนบใหม่'));
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result); fr.onerror = () => reject(new Error('อ่านรูปไม่ได้ ลองแคปหน้าจอแล้วแนบใหม่'));
    fr.readAsDataURL(file);
  });
}
function shrinkImage(file, max = 1600) {
  return Promise.race([shrinkCanvas(file, max), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000))])
    .catch(() => readRaw(file));
}
function shrinkCanvas(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => reject(new Error('อ่านรูปไม่ได้'));
    img.src = URL.createObjectURL(file);
  });
}

function labStepsHtml(l, steps) {
  if (l.kind === 'ในบ้าน' && l.plan && l.plan.length) return `<div style="margin:6px 0;border-left:3px solid var(--line);padding-left:8px">${l.plan.map((s, i) => {

  };

  // v19e: ติ๊กได้หลายขั้น · เพิ่ม/แก้/ลบขั้น · บันทึกครั้งเดียวต่องาน

  app.querySelectorAll('[data-lp]').forEach(host => {
    const l = r.labs.find(x => x.id === host.dataset.lp); if (!l) return;
    const sig = arr => JSON.stringify(arr.map(x => [x.n, x.w, !!x.d, x.m || '']));
    const orig = sig(l.plan);
    const P = l.plan.map(x => ({...x, d: !!x.d}));
    let edit = -1;
    const changed = () => sig(P) !== orig;

      const cur = P.findIndex(x => !x.d);
      host.innerHTML = `<div style="margin:6px 0;border-left:3px solid var(--line);padding-left:8px">${P.map((s, i) => {
        if (edit === i) return `<div style="display:grid;grid-template-columns:1fr 92px;gap:6px;padding:4px 0"><input data-lpn value="${esc(s.n)}" aria-label="ชื่อขั้น"><select data-lpw aria-label="ใครทำ">${WHO.map(w => `<option ${w === s.w ? 'selected' : ''}>${esc(w)}</option>`).join('')}</select>
          <button type="button" class="btn ghost small" data-lpok>ตกลง</button><button type="button" class="btn ghost small" data-lpx="${i}" style="color:var(--bad)">เอาขั้นนี้ออก</button></div>`;
        const m = String(s.at || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
        return `<div style="display:flex;align-items:center;gap:8px;padding:3px 0">
          <input type="checkbox" data-lpd="${i}" ${s.d ? 'checked' : ''} style="width:22px;height:22px;flex:none" aria-label="${esc(s.n)} เสร็จ">
          <span class="grow" style="font-size:14px;${i === cur ? 'font-weight:700' : s.d ? 'color:var(--muted)' : ''}">${i + 1}. ${esc(s.n)} <span class="s">(${esc(s.w || '-')})${s.d && s.by ? ' · ' + esc(s.by) + (m ? ' ' + (+m[3]) + '/' + (+m[2]) : '') : ''}</span></span>
          ${s.k === 'เลือกวิธี' && s.d ? `<select data-lpm="${i}" style="width:auto;padding:4px">${['', 'มิลลิ่ง', '3D print'].map(o => `<option ${o === (s.m || '') ? 'selected' : ''} value="${o}">${o || 'วิธี?'}</option>`).join('')}</select>` : ''}
          <button type="button" class="btn ghost small" data-lpe="${i}" aria-label="แก้ขั้น">✎</button></div>`; }).join('')}</div>
        <details style="margin:4px 0"><summary class="s" style="cursor:pointer">+ เพิ่มขั้น</summary>
          <div style="display:grid;grid-template-columns:1fr 92px;gap:6px;margin-top:6px"><input data-lpan placeholder="ชื่อขั้นใหม่ เช่น ลองงานในปาก"><select data-lpaw>${WHO.map(w => `<option>${esc(w)}</option>`).join('')}</select>
          <select data-lpap aria-label="ใส่ต่อจาก">${P.map((s, i) => `<option value="${i + 1}" ${i === (cur < 0 ? P.length - 1 : cur) ? 'selected' : ''}>ต่อจากขั้น ${i + 1}</option>`).join('')}<option value="0">ไว้ขั้นแรก</option></select><button type="button" class="btn ghost small" data-lpa>เพิ่ม</button></div></details>
        <button type="button" class="btn small" data-lps style="width:100%;margin-top:6px" ${changed() ? '' : 'disabled'}>${changed() ? 'บันทึกขั้นงานแล็บ' : 'ติ๊กขั้นที่เสร็จ (ได้หลายขั้น) แล้วกดบันทึก'}</button>`;
      host.querySelectorAll('[data-lpd]').forEach(cb => cb.onchange = () => { const i = +cb.dataset.lpd; P[i].d = cb.checked; if (!cb.checked) P[i].m = ''; render(); });

      host.querySelectorAll('[data-lpe]').forEach(b => b.onclick = () => { edit = +b.dataset.lpe; render(); });
      const ok = host.querySelector('[data-lpok]');
      if (ok) ok.onclick = () => { const n = host.querySelector('[data-lpn]').value.trim(); if (n) P[edit].n = n; P[edit].w = host.querySelector('[data-lpw]').value; edit = -1; render(); };
      host.querySelectorAll('[data-lpx]').forEach(b => b.onclick = () => { if (P.length < 2) return flash('ต้องมีอย่างน้อย 1 ขั้น'); P.splice(+b.dataset.lpx, 1); edit = -1; render(); });
      host.querySelector('[data-lpa]').onclick = () => { const n = host.querySelector('[data-lpan]').value.trim(); if (!n) return flash('พิมพ์ชื่อขั้นก่อน');
        if (P.some(x => x.n === n)) return flash('มีขั้นชื่อนี้แล้ว');
        P.splice(+host.querySelector('[data-lpap]').value, 0, {id: 'n' + Date.now(), n, w: host.querySelector('[data-lpaw]').value, k: 'ทำ', d: false}); render(); };
      host.querySelector('[data-lps]').onclick = async ev => {
        if (P.some(x => x.k === 'เลือกวิธี' && x.d && !x.m)) return flash('เลือกวิธีด้วย (มิลลิ่ง / 3D print)');
        if (new Set(P.map(x => x.n)).size !== P.length) return flash('มีชื่อขั้นซ้ำกัน แก้ชื่อก่อน');
        ev.target.disabled = true; ev.target.textContent = 'กำลังบันทึก…';
        const res = await api('labPlanSave', {id: l.id, steps: P.map(x => ({id: x.id, n: x.n, w: x.w, k: x.k, b: x.b, d: x.d, m: x.m || ''}))}).catch(e => ({ok: false, error: e.message}));
        if (!res.ok) { render(); return flash(errMsg(res)); }
        openLabId = l.id; await viewLab(); flash(res.done ? 'ครบทุกขั้นแล้ว · งานพร้อมใส่' : 'บันทึกขั้นงานแล็บแล้ว', true);
      };
    };
    render();
  });

  app.querySelectorAll('.labcard').forEach(cardEl => {
    const id = cardEl.dataset.lab, step = cardEl.dataset.step, box = cardEl.querySelector('.labform');
    const done = async (payload, okText) => {
      cardEl.querySelectorAll('button').forEach(x => x.disabled = true);
      const res = await api(payload.action, {id, ...payload}).catch(e => ({ok:false, error:e.message}));
      if (!res.ok) { cardEl.querySelectorAll('button').forEach(x => x.disabled = false); return flash(errMsg(res)); }
      await viewLab(); flash(okText, true);
    };
    cardEl.querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => {
      const act = btn.dataset.act;
      if (act === 'done') return done({action: 'labStep', step, decision: 'done', method: btn.dataset.method || ''}, 'บันทึกแล้ว ส่งต่อให้คนถัดไป');
      if (act === 'pass') return done({action: 'labStep', step, decision: 'pass'}, 'ผ่านแล้ว ส่งต่อขั้นถัดไป');
      if (act === 'fitted') return done({action: 'labStatus', status: 'ใส่แล้ว'}, 'บันทึกว่าใส่ให้คนไข้แล้ว');
      if (act === 'fix' || act === 'redo') {
        box.innerHTML = `<form><label>ต้องแก้อะไร</label><input required class="fixNote">${act === 'redo' ? '<label>แล็บนัดส่งกลับใหม่</label><input type="date" class="fixDue">' : ''}
          <button class="btn small" type="submit" style="margin-top:8px">ส่งกลับไปแก้</button></form>`;
        box.querySelector('form').onsubmit = ev => { ev.preventDefault();
          const note = box.querySelector('.fixNote').value.trim();
          if (act === 'fix') done({action: 'labStep', step, decision: 'fix', note}, 'ส่งกลับไปแก้แล้ว');
          else done({action: 'labStatus', status: 'ส่งแก้', note, due: box.querySelector('.fixDue').value}, 'บันทึกส่งแก้แล้ว');
        };
        return box.querySelector('input').focus();
      }
      if (act === 'receive') {
        box.innerHTML = `<form>
          <label>ถ่ายรูปใบส่งงาน</label><input type="file" accept="image/*" capture="environment" class="rcPhoto">
          <label>ค่าแล็บ (บาท)</label><input type="number" inputmode="decimal" min="0" required class="rcFee">
          <button class="btn small" type="submit" style="margin-top:8px;width:100%">รับงานแล้ว</button></form>`;
        box.querySelector('form').onsubmit = async ev => { ev.preventDefault();
          const file = box.querySelector('.rcPhoto').files[0];
          const sb = box.querySelector('button'); sb.disabled = true; sb.textContent = file ? 'กำลังส่งรูป…' : 'กำลังบันทึก…';
          let photo = '';
          try { if (file) photo = await shrinkImage(file); } catch (e) { sb.disabled = false; sb.textContent = 'รับงานแล้ว'; return flash(e.message); }
          done({action: 'labReceive', fee: box.querySelector('.rcFee').value, photo}, 'รับงานกลับแล้ว');
        };
      }
    });
  });

  const lsBtn = document.getElementById('lsBtn');
  if (lsBtn) lsBtn.onclick = async () => {
    const out = document.getElementById('lsOut'); out.innerHTML = '<p class="s">กำลังคำนวณ…</p>';
    const s = await api('labSummary', {month: lsMonth.value}).catch(e => ({ok:false, error:e.message}));
    if (!s.ok) return out.innerHTML = `<div class="msg err">${esc(errMsg(s))}</div>`;
    const rows = o => Object.entries(o).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="s">${esc(k)} · ${baht(v)} บาท</div>`).join('') || '<div class="s">–</div>';
    out.innerHTML = `<div class="t" style="margin-top:10px">รวม ${baht(s.total)} บาท (${s.count} งาน)</div>
      <div class="t" style="margin-top:8px">แยกตามแล็บ</div>${rows(s.byLab)}<div class="t" style="margin-top:8px">แยกตามงาน</div>${rows(s.byWork)}`;
  };

  if (openLabId) { const el = document.getElementById('lab-' + openLabId); openLabId = null; if (el) { el.style.outline = '3px solid var(--warn)'; el.scrollIntoView({behavior: 'smooth', block: 'center'}); } }
  if (openLabNew) { const nl = document.getElementById('newLab'), sel = document.getElementById('nlCase'); if (nl) nl.open = true; if (sel && [...sel.options].some(o => o.value === openLabNew)) { sel.value = openLabNew; sel.dispatchEvent(new Event('change')); } openLabNew = null; if (nl) nl.scrollIntoView({behavior: 'smooth', block: 'start'}); }
}

const CASE_COST_CATS = ['รากเทียม', 'อะบัตเมนต์', 'กระดูก', 'เมมเบรน', 'ไหมเย็บ', 'หลอดปั่นเลือด'];
const LOT_CATS = ['รากเทียม', 'อะบัตเมนต์', 'กระดูก', 'เมมเบรน'];
async function moveForm(btn) {
  app.querySelectorAll('.move').forEach(x => x.remove());
  const row = btn.closest('.row');
  const item = stockItems.find(i => String(i['รหัสสินค้า']) === btn.dataset.code) || {};
  const cat = String(item['หมวด'] || '').trim();
  const forCase = btn.dataset.type === 'เบิก' && CASE_COST_CATS.includes(cat);
  const needLot = forCase && LOT_CATS.includes(cat);
  const f = document.createElement('form'); f.className = 'move'; f.style.width = '100%'; f.style.flexWrap = 'wrap';
  let caseSel = '';
  if (forCase) {
    const list = await getCases().catch(() => []);
    caseSel = `<div style="width:100%"><label for="mvCase">ใช้กับเคส</label><select id="mvCase" required><option value="">เลือกเคส</option>${list.map(c => `<option value="${esc(c.id)}">${esc(c.name)} · ${esc(c.work)}</option>`).join('')}</select>
      ${list.length ? '' : '<p class="note">ยังไม่มีเคส ไปเปิดเคสที่แท็บ "เคส" ก่อน</p>'}</div>
      ${needLot ? '<div style="width:100%"><label for="mvLot">Lot number</label><input id="mvLot" required placeholder="ดูจากสติกเกอร์ข้างกล่อง"></div>' : ''}`;
  }
  f.innerHTML = `${caseSel}<div class="grow"><label for="qty">${esc(btn.dataset.type)} จำนวน</label><input id="qty" type="number" min="1" inputmode="numeric" required></div>
    <button class="btn small" type="submit">บันทึก</button><button class="btn ghost small" type="button">ยกเลิก</button>`;
  row.appendChild(f);
  (f.querySelector('select') || f.querySelector('#qty')).focus();
  f.querySelector('button[type=button]').onclick = () => f.remove();
  f.onsubmit = async ev => {
    ev.preventDefault();
    const s = f.querySelector('button[type=submit]'); s.disabled = true;
    const r = await api('stockMove', {code: btn.dataset.code, type: btn.dataset.type, qty: f.querySelector('#qty').value,
      caseId: forCase ? f.querySelector('#mvCase').value : '', lot: needLot ? f.querySelector('#mvLot').value.trim() : ''})
      .catch(e => ({ok:false, error:e.message}));
    if (!r.ok) { s.disabled = false; return alertBox(errMsg(r)); }
    if (item) item['คงเหลือ'] = r.left;
    if (forCase) { const u = await api('reserveUse', {caseId: f.querySelector('#mvCase').value, code: btn.dataset.code, qty: f.querySelector('#qty').value}).catch(() => null);
      if (u && u.used) { const rv = await api('reserved').catch(() => null); if (rv && rv.ok) stockReserved = rv.reserved; } }
    renderStock(document.getElementById('q')?.value || '');
    const m = document.getElementById('m');
    m.innerHTML = `<div class="msg ${r.low ? 'err' : 'ok'}">บันทึกแล้ว คงเหลือ ${esc(r.left)}${r.low ? ' · ต่ำกว่าจุดสั่งซื้อ' : ''}${forCase ? ' · ผูกกับเคสแล้ว' : ''}</div>`;
  };
}

  });

    if (!res.ok) { b.disabled = false; return flash(errMore(res)); }
    await viewBuy(); flash(`จ่ายคืน ${b.dataset.pay} ${baht(res.total)} บาท (${res.count} บิล) เงินกองกลางเหลือ ${baht(res.balance)}`, true);

    await viewBuy(); flash(res.diff === 0 ? 'นับตรงกับระบบ' : `ไม่ตรง ต่าง ${baht(res.diff)} บาท ระบบแจ้งหมอแล้ว`, res.diff === 0);
  };
  const ca = document.getElementById('ca');
  if (ca) ca.onsubmit = async ev => { ev.preventDefault();

    await viewBuy(); flash('เติมเงินแล้ว คงเหลือ ' + baht(res.balance), true);
  };
}

  dn.onchange = () => { const p = r.patients.find(x => x.dn === dn.value.trim()); if (p) { dfNick.value = p.nick; if (p.doctor && !dfDoc.value) dfDoc.value = p.doctor; } };
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { dfTreat.value = b.dataset.t; app.querySelectorAll('[data-t]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
  const nums = ['dfCash', 'dfTr', 'dfCard', 'dfX'].map(id => document.getElementById(id));
  const upd = () => { dfTotal.textContent = 'รวม ' + baht(nums.reduce((n, i) => n + Number(i.value || 0), 0)) + ' บาท'; slipBox.hidden = !(Number(dfTr.value) > 0); };
  nums.forEach(i => i.oninput = upd);
  document.getElementById('df').onsubmit = async ev => {
    ev.preventDefault();
    const b = ev.target.querySelector('button[type=submit]'); b.disabled = true; b.textContent = 'กำลังบันทึก…';
    let slips = [];
    try { slips = await photosOf(dfSlip); } catch (e) { b.disabled = false; b.textContent = 'บันทึก'; return flash(e.message); }
    const res = await call('dailyAdd', {dn: dn.value, nick: dfNick.value, doctor: dfDoc.value, treat: dfTreat.value, cash: dfCash.value, transfer: dfTr.value,
      card: dfCard.value, xray: dfX.value, slips, slipLater: dfLater.checked, note: dfNote.value});

    await viewDaily(); flash('บันทึกแล้ว', true);
  };
  app.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => {
    const box = b.parentElement.querySelector('.xBox');
    box.innerHTML = `<form class="move"><div class="grow"><label>เหตุผลที่ยกเลิก</label><input required></div><button class="btn small" type="submit">ยืนยันยกเลิก</button></form>`;
    box.querySelector('form').onsubmit = async ev => { ev.preventDefault();
      const res = await call('dailyCancel', {id: b.dataset.cancel, reason: box.querySelector('input').value});
      if (!res.ok) return flash(errMore(res));
      await viewDaily(); flash('ยกเลิกรายการแล้ว', true);
    };

  app.querySelectorAll('[data-slip]').forEach(b => b.onclick = () => {
    const box = b.parentElement.querySelector('.xBox');
    box.innerHTML = `<form class="move"><div class="grow"><label>รูปสลิป</label><input type="file" accept="image/*" multiple required></div><button class="btn small" type="submit">แนบ</button></form>`;
    box.querySelector('form').onsubmit = async ev => { ev.preventDefault();
      const sb = box.querySelector('button'); sb.disabled = true;
      let slips = [];
      try { slips = await photosOf(box.querySelector('input')); } catch (e) { sb.disabled = false; return flash(e.message); }
      const res = await call('dailySlip', {id: b.dataset.slip, slips});
      if (!res.ok) { sb.disabled = false; return flash(errMore(res)); }
      await viewDaily(); flash('แนบสลิปแล้ว', true);
    };
  });
  document.getElementById('cl').onsubmit = async ev => { ev.preventDefault();
    const res = await call('dailyClose', {counted: clAmt.value});
    if (!res.ok) return flash(errMore(res));
    await viewDaily(); flash(res.match ? 'ปิดยอดแล้ว เงินสดตรงกับที่ลงไว้' : 'ปิดยอดแล้ว แต่เงินสดไม่ตรงกับที่ลงไว้ ระบบแจ้งหมอแล้ว', res.match);
  };
  if (owner) {
    const out = document.getElementById('rpOut');
    rpBtn.onclick = async () => {
      out.innerHTML = '<p class="s">กำลังคำนวณ…</p>';
      const s = await call('dailyReport', {date: rpDate.value});
      if (!s.ok) return out.innerHTML = `<div class="msg err">${esc(errMore(s))}</div>`;
      out.innerHTML = `<div class="t" style="margin-top:10px">รวม ${baht(s.sum.total)} บาท</div>
        <div class="s">สด ${baht(s.sum.cash)} · โอน ${baht(s.sum.transfer)} · บัตร ${baht(s.sum.card)} · X-ray ${baht(s.sum.xray)}</div>
        ${s.flags.map(f => `<div class="s bad">⚠️ ${esc(f)}</div>`).join('')}
        ${Object.entries(s.byDoc).map(([d, x]) => `<div class="t" style="margin-top:8px">${esc(d)} · ${baht(x.total)} บาท (${x.n})</div><div class="s">สด ${baht(x.cash)} · โอน ${baht(x.transfer)} · บัตร ${baht(x.card)}</div>`).join('')}
        <details><summary class="s" style="cursor:pointer;margin-top:8px">รายการ ${s.list.length}</summary>${s.list.map(x => `<div class="s">${esc(x.dn)} ${esc(x.nick)} · ${esc(x.doctor)} · ${esc(x.treat)} · ${baht(x.total)}${x.slip ? x.slip.split('\n').map((u, i) => ` · <a href="${esc(u)}" target="_blank" rel="noopener">สลิป${i + 1}</a>`).join('') : ''}</div>`).join('')}</details>
        ${s.spend.length ? `<div class="t" style="margin-top:8px">รายจ่ายวันนี้ ${baht(s.spend.reduce((n, x) => n + x.amount, 0))} บาท</div>${s.spend.map(x => `<div class="s">${esc(x.items)} · ${baht(x.amount)} · ${esc(x.pay)} · ${esc(x.by)}</div>`).join('')}` : ''}`;
    };
    rmBtn.onclick = async () => {
      out.innerHTML = '<p class="s">กำลังคำนวณ…</p>';
      const s = await call('monthReport', {month: rpMonth.value});
      if (!s.ok) return out.innerHTML = `<div class="msg err">${esc(errMore(s))}</div>`;
      out.innerHTML = `<div class="t" style="margin-top:10px">รายรับ ${baht(s.revenue)} · รายจ่าย ${baht(s.spend)} บาท</div>
        <div class="s">ค้างจ่ายร้าน ${baht(s.owedShop)} · รอเบิกคืนพนักงาน ${baht(s.owedStaff)} · เงินกองกลาง ${baht(s.cash)}</div>
        <div class="t" style="margin-top:8px">DF ${s.pct}% ของ (รายรับ − แล็บ − ของ)</div>
        ${s.df.map(x => `<div class="s"><b>${esc(x.doctor)}</b> · รับ ${baht(x.revenue)} − แล็บ ${baht(x.lab)} − ของ ${baht(x.material)} = ${baht(x.net)} → DF ${baht(x.df)}</div>`).join('') || '<div class="s">–</div>'}
        <div class="t" style="margin-top:8px">รายจ่ายแยกหมวด</div>
        ${Object.entries(s.spendByCat).map(([k, v]) => `<div class="s">${esc(k)} · ${baht(v)}</div>`).join('') || '<div class="s">–</div>'}`;
    };
  }
}

// ---------- เคส + แผนการรักษา + จองของ ----------
let caseStage = 'ทั้งหมด';
async function viewCases2() {
  app.innerHTML = '<div class="center">กำลังโหลดเคส…</div>';
  const r = await call('caseList');
  if (!r.ok) return showError('โหลดเคสไม่ได้: ' + r.error);
  casesCache = r.cases.map(c => ({id: c.id, name: c.name, work: c.work}));
  const owner = me.role === 'owner';
  // กลุ่มตามสิ่งที่เคสรออยู่ (สถานะ = ขั้นแรกที่ยังรอ)
  const grp = c => c.status === 'รอแผนจากหมอ' ? 'รอแผนจากหมอ' : c.overdue ? 'เลยกำหนด' : c.wait ? 'รอ' + c.wait : 'อื่นๆ';
  const groups = [...new Set(r.cases.map(grp))];
  if (caseStage !== 'ทั้งหมด' && !groups.includes(caseStage)) caseStage = 'ทั้งหมด';
  const list = r.cases.filter(c => caseStage === 'ทั้งหมด' || grp(c) === caseStage);
  // v19: รวมงานของคนไข้คนเดียวกันเป็นการ์ดเดียว · บรรทัดละงาน: งาน · นัดครั้งต่อไป · สถานะ
  const patientCards = jobs => {
    const keys = [...new Set(jobs.map(c => c.key))];
    if (!keys.length) return '<div class="card s">ไม่มีเคสในกลุ่มนี้</div>';
    return keys.map(k => { const js = jobs.filter(c => c.key === k), p = js[0];
      return `<div class="card pcard" style="padding:10px 12px">
        <div style="display:flex;align-items:center;gap:8px"><button type="button" data-pt="${esc(k)}" style="all:unset;cursor:pointer;flex:1;font-weight:700;font-size:16px">${esc(p.dn ? p.dn + ' ' : '')}${esc(p.name)} <span class="s" style="font-weight:400">›</span></button>
          <button class="btn ghost small" type="button" data-addjob="${esc(k)}" aria-label="เพิ่มงานให้ ${esc(p.name)}">＋</button></div>
        ${js.map(jobLine).join('')}</div>`; }).join('');
  };
  app.innerHTML = `
    <div id="m"></div>
    <details class="card"><summary class="t" style="cursor:pointer">+ เปิดเคสใหม่</summary>
      <form id="nc">
        <label for="ncName">ชื่อเล่นคนไข้</label><input id="ncName" required placeholder="ชื่อเล่นหรือชื่อต้น ไม่ใส่นามสกุล">
        <label for="ncDn">DN (ถ้ามีแล้ว)</label><input id="ncDn" list="pts2">
        <datalist id="pts2">${r.patients.map(p => `<option value="${esc(p.dn)}">${esc(p.nick)}</option>`).join('')}</datalist>
        <label for="ncDoc">หมอ</label><select id="ncDoc" required><option value="">เลือกหมอ</option>${opts(r.doctors)}</select>
        <label>งาน (เลือกได้หลายอย่าง · ขั้นตอนใส่ให้ตามแม่แบบ)</label><div class="cats" id="ncWorks" role="group" aria-label="งาน">${r.templates.map(t => `<button type="button" data-work="${esc(t)}" aria-pressed="false">${esc(t)}</button>`).join('')}</div>
        <label for="ncOther">งานอื่น (ถ้าไม่มีในรายการ)</label><input id="ncOther" placeholder="เช่น ฟอกสีฟัน">
        <label for="ncTooth">ซี่ฟัน</label><input id="ncTooth" placeholder="เช่น 36 หรือ 11 21 หรือ 13-23">
        <button class="btn" type="submit" style="width:100%;margin-top:12px">เปิดเคส</button>
      </form></details>
    <div class="cats" role="group" aria-label="สถานะ">${['ทั้งหมด', ...groups].map(s => `<button type="button" data-st="${esc(s)}" aria-pressed="${s === caseStage}">${esc(s)} ${s === 'ทั้งหมด' ? r.cases.length : r.cases.filter(c => grp(c) === s).length}</button>`).join('')}</div>
    ${patientCards(list)}
    <button class="btn ghost small" id="allCases" type="button">ดูเคสที่จบแล้ว / ไม่รักษา</button>
    <p class="note">ใช้ DN + ชื่อเล่นเท่านั้น ไม่ใส่นามสกุลหรือเบอร์โทร</p>`;
  app.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { caseStage = b.dataset.st; viewCases2(); });
  app.querySelectorAll('[data-case]').forEach(el => el.onclick = () => viewCase2(el.dataset.case));
  app.querySelectorAll('[data-pt]').forEach(el => el.onclick = () => viewPatient(el.dataset.pt));
  app.querySelectorAll('[data-addjob]').forEach(el => el.onclick = () => viewPatient(el.dataset.addjob, {add: true}));
  document.getElementById('allCases').onclick = async () => {
    const all = await call('caseList', {all: true});
    const closed = (all.cases || []).filter(c => ['จบเคส', 'ไม่รักษา'].includes(c.status));
    app.insertAdjacentHTML('beforeend', `<div class="list">${closed.map(c => `<div class="row" data-case="${esc(c.id)}" style="cursor:pointer"><div class="grow"><div class="t">${esc(c.name)} · ${esc(c.work)}</div><div class="s">${esc(c.id)}${c.lostReason ? ' · ' + esc(c.lostReason) : ''}</div></div><span class="pill">${esc(c.status)}</span></div>`).join('') || '<div class="row s">ไม่มี</div>'}</div>`);
    app.querySelectorAll('[data-case]').forEach(el => el.onclick = () => viewCase2(el.dataset.case));
  };
  app.querySelectorAll('#ncWorks [data-work]').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
  document.getElementById('nc').onsubmit = async ev => {
    ev.preventDefault();
    const works = [...app.querySelectorAll('#ncWorks [aria-pressed="true"]')].map(x => x.dataset.work);
    if (!works.length && !ncOther.value.trim()) return flash('เลือกงานอย่างน้อย 1 อย่าง หรือพิมพ์ในช่องงานอื่น');
    const b = ev.target.querySelector('button[type=submit]'); b.disabled = true;
    const res = await call('caseNew', {name: ncName.value, dn: ncDn.value, doctor: ncDoc.value, works, work: ncOther.value.trim(), tooth: ncTooth.value.trim(),});
    if (!res.ok) { b.disabled = false; return flash(errMore(res)); }
    casesCache = null; await viewCases2(); flash('เปิดเคส ' + res.id + ' แล้ว', true);
  };
}

// บรรทัดงานในการ์ดคนไข้: งาน · นัดครั้งต่อไป · สถานะ
function jobLine(c) {
  JOBS[c.id] = c;
  const ap = c.appt ? `นัดครั้งหน้า ${fmtDate(c.appt.date)} ${esc(String(c.appt.start || '').slice(0, 5))}${c.appt.unlinked ? ' <span class="s" style="font-size:11px">(นัดไม่ระบุงาน)</span>' : ''}`
    : ['จบเคส', 'ไม่รักษา'].includes(c.status) ? '' : `<button type="button" data-mkappt="${esc(c.id)}" style="all:unset;cursor:pointer;color:var(--bad);font-weight:600;text-decoration:underline">ยังไม่ได้นัด · กดลงนัด</button>`;
  const lab = /แล็บ/.test(c.status + ' ' + (c.wait || ''));
  const pillAttr = lab ? (c.labId ? `data-golab="${esc(c.labId)}"` : `data-newlab="${esc(c.id)}"`) : '';
  const due = c.due ? ` · <span class="bad" style="font-weight:600">${c.overdue ? 'เลยกำหนด' : 'ครบ'} ${fmtDate(c.due)}</span>` : '';
  return `<div class="row" data-case="${esc(c.id)}" style="cursor:pointer;padding:8px 0;border-top:1px solid var(--line);margin:0;background:none;box-shadow:none;border-radius:0">
    <div class="grow" style="min-width:0"><div class="t" style="font-size:15px">${esc(c.work)}</div>
      <div class="s" style="font-size:12px">${ap}${due}${c.flags && c.flags.some(f => f.startsWith('มีของ')) ? ' · <span class="bad">รอของ</span>' : ''}</div></div>
    ${pillAttr ? `<button type="button" class="pill" ${pillAttr} style="border:0;cursor:pointer;max-width:42%;white-space:normal;text-align:center;text-decoration:underline;${c.overdue ? 'background:var(--badbg);color:var(--bad)' : ''}">${esc(c.status)} ›</button>`
      : `<span class="pill" style="max-width:42%;white-space:normal;text-align:center;${c.overdue ? 'background:var(--badbg);color:var(--bad)' : ''}">${esc(c.status)}</span>`}<span class="s" style="padding-left:4px">›</span></div>`;
}
// v19b: กดสถานะรอแล็บ → ไปงานแล็บนั้น · กด "ยังไม่ได้นัด" → ไปลงนัด (เติม DN + ติ๊กงานให้)
const JOBS = {};
let pendingAppt = null, openLabNew = null;
document.addEventListener('click', e => {
  const g = e.target.closest('[data-golab],[data-newlab],[data-mkappt]'); if (!g) return;
  e.preventDefault(); e.stopPropagation();
  if (g.dataset.golab) { openLabId = g.dataset.golab; if (location.hash === '#lab') route(); else location.hash = 'lab'; return; }
  if (g.dataset.newlab) { openLabNew = g.dataset.newlab; location.hash = 'lab'; return; }
  const c = JOBS[g.dataset.mkappt]; if (!c) return;
  pendingAppt = {dn: c.dn || '', nick: c.name, doctor: c.dentist, caseId: c.id}; location.hash = 'appt';
}, true);

  jf.onsubmit = async ev => {
    ev.preventDefault();
    const works = [...app.querySelectorAll('#jfWorks [aria-pressed="true"]')].map(x => x.dataset.work);
    if (!works.length && !jfOther.value.trim()) return flash('เลือกงาน หรือพิมพ์ในช่องงานอื่น');
    const b = jf.querySelector('button[type=submit]'); b.disabled = true; b.textContent = 'กำลังเพิ่ม…';
    const res = await call('caseNew', {name: r.name, dn: r.dn, doctor: jfDoc.value, works, work: jfOther.value.trim(), tooth: jfTooth.value.trim()});
    if (!res.ok) { b.disabled = false; b.textContent = 'เพิ่มงาน'; return flash(errMore(res)); }
    casesCache = null; viewPatient(key, {msg: 'เพิ่มงานแล้ว (' + res.id + ') · กดที่งานเพื่อดูขั้นตอน'});
  };
  const pn = document.getElementById('ptNote');
  if (pn) {
    pn.oninput = () => { ptNoteSave.disabled = pn.value === r.note; };
    ptNoteSave.onclick = async () => {
      ptNoteSave.disabled = true;
      const res = await call('patientNote', {dn: r.dn, name: r.name, note: pn.value});
      if (!res.ok) { ptNoteSave.disabled = false; return flash(errMore(res)); }
      r.note = pn.value; flash('บันทึกหมายเหตุแล้ว', true);
    };
  }
}

          <input data-eno="${esc(s.id)}" value="${esc(s.note || '')}" placeholder="หมายเหตุ (ถ้ามี)" style="margin:6px 0 0">

        : `<div class="${open ? 't' : 's'}" style="${open ? '' : 'text-decoration:line-through'}">${i + 1}. ${esc(s.name || '(ยังไม่ตั้งชื่อ)')}</div>
          <div class="s" style="font-size:12px">${s.wait ? 'รอ' + esc(s.wait) : ''}${open && ownerOf(s) ? ' · ผู้ดูแล ' + esc(ownerOf(s)) : ''}${s.note ? ' · ' + esc(s.note) : ''}${!open ? ' · ' + esc(es) + (s.doneAt && !p ? ' ' + fmtDate(s.doneAt) + ' ' + esc(s.by) : '') : ''}</div>
          ${s.due && open ? `<div class="bad" style="font-size:12px;font-weight:600">${overdue ? 'เลยกำหนด' : 'ครบกำหนด'} ${fmtDate(s.due)}</div>` : ''}`}
        ${pend ? `<div class="s warn" style="font-size:12px">${pend}</div>` : ''}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        ${ed ? '' : `<button class="btn ghost small" type="button" data-edit="${esc(s.id)}" aria-label="แก้ขั้น">✎</button>`}
        ${s.isNew ? `<button class="btn ghost small" type="button" data-rmnew="${esc(s.id)}">เอาออก</button>`
          : s.status === 'รอ' ? `<button class="btn small" data-step="${esc(s.id)}" data-d="done">เสร็จ</button><button class="btn ghost small" data-step="${esc(s.id)}" data-d="skip">ข้าม</button>`
          : `<button class="btn ghost small" data-step="${esc(s.id)}" data-d="undo">ย้อน</button>`}</div></div>${P.surg[s.id] ? surgHtml(s.id) : ''}`;
  };
  const renderSteps = () => {
    stepList.innerHTML = S.length ? S.map(stepHtml).join('') : '<div class="row s">ยังไม่มีขั้นตอน · สถานะ = รอแผนจากหมอ · กด "+ เพิ่มขั้น" หรือใส่จากแม่แบบ</div>';
    stepList.querySelectorAll('[data-step]').forEach(b => {
      const p = P.steps[b.dataset.step]; const on = !!(p && p.decision === b.dataset.d);
      b.setAttribute('aria-pressed', on); b.style.outline = on ? '3px solid var(--warn)' : '';
      b.onclick = () => { const sid = b.dataset.step, cur = P.steps[sid], st = S.find(x => x.id === sid) || {};
        if (cur && cur.decision === b.dataset.d) delete P.steps[sid]; else P.steps[sid] = {id: sid, decision: b.dataset.d, name: st.name};
        if (P.steps[sid] && P.steps[sid].decision === 'done' && isSurg(st)) { if (!P.surg[sid]) P.surg[sid] = newSurg(); } else delete P.surg[sid];
        refresh(); };
    });
    stepList.querySelectorAll('[data-su]').forEach(b => b.onclick = () => { const v = P.surg[b.dataset.su][b.dataset.k], val = b.dataset.v;
      if (val === '0') { v.use = v.use === false ? null : false; v.choice = ''; }
      else if (val === '1') { v.use = v.use === true ? null : true; if (v.use && !v.rows.length) v.rows.push({code: '', qty: 1, lot: '', tooth: '', text: ''}); }
      else { const on = !(v.use && v.choice === val); v.use = on ? true : null; v.choice = on ? val : ''; if (on && val === 'Collagen membrane' && !v.rows.length) v.rows.push({code: '', qty: 1, lot: '', tooth: '', text: ''}); }
      refresh(); });
    stepList.querySelectorAll('[data-suadd]').forEach(b => b.onclick = () => { const [sid, k] = b.dataset.suadd.split('|'); P.surg[sid][k].rows.push({code: '', qty: 1, lot: '', tooth: '', text: ''}); refresh(); });
    stepList.querySelectorAll('[data-sf]').forEach(el => { const [sid, k, i, f] = el.dataset.sf.split('|');
      const set = () => { P.surg[sid][k].rows[+i][f] = el.value; };
      if (el.tagName === 'SELECT') el.onchange = () => { set(); refresh(); }; else el.oninput = set; });
    stepList.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { editing = b.dataset.edit; refresh(); const inp = stepList.querySelector('[data-en]'); if (inp) inp.focus(); });
    stepList.querySelectorAll('[data-eok]').forEach(b => b.onclick = () => { editing = null; refresh(); });
    stepList.querySelectorAll('[data-en]').forEach(el => el.oninput = () => { S.find(x => x.id === el.dataset.en).name = el.value; refreshBar(); });
    stepList.querySelectorAll('[data-ew]').forEach(el => el.onchange = () => { S.find(x => x.id === el.dataset.ew).wait = el.value; refresh(); });
    stepList.querySelectorAll('[data-eo]').forEach(el => el.onchange = () => { S.find(x => x.id === el.dataset.eo).owner = el.value; refreshBar(); });
    stepList.querySelectorAll('[data-ed]').forEach(el => el.onchange = () => { S.find(x => x.id === el.dataset.ed).due = el.value; refreshBar(); });
    stepList.querySelectorAll('[data-eno]').forEach(el => el.oninput = () => { S.find(x => x.id === el.dataset.eno).note = el.value; refreshBar(); });
    stepList.querySelectorAll('[data-rmnew]').forEach(b => b.onclick = () => { const i = S.findIndex(x => x.id === b.dataset.rmnew); if (i > -1) S.splice(i, 1); if (editing === b.dataset.rmnew) editing = null; refresh(); });
    stepList.querySelectorAll('[data-drag]').forEach(h => h.onpointerdown = startDrag);
  };
  // ---- ลากเรียง (แบบเพิ่มจุดแวะ Google Maps) ----
  function startDrag(ev) {
    ev.preventDefault();
    const sid = ev.currentTarget.dataset.drag;
    const row = stepList.querySelector(`[data-sid="${CSS.escape(sid)}"]`);
    row.style.opacity = '.6'; row.style.boxShadow = '0 4px 14px rgba(0,0,0,.18)';
    const move = e => {
      const y = e.clientY;
      const rows = [...stepList.querySelectorAll('[data-sid]')].filter(x => x !== row);
      const after = rows.find(x => { const b = x.getBoundingClientRect(); return y < b.top + b.height / 2; });
      if (after) stepList.insertBefore(row, after); else stepList.appendChild(row);
      if (y > innerHeight - 90) scrollBy(0, 12); else if (y < 90) scrollBy(0, -12);
    };
    const up = () => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      const ids = [...stepList.querySelectorAll('[data-sid]')].map(x => x.dataset.sid);
      S.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
      refresh();
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  }
  const refreshBar = () => {
    const n = count();
    saveAll.disabled = n === 0;
    saveAll.textContent = n ? `บันทึกทั้งหมด (${n} รายการ)` : 'บันทึกทั้งหมด';
    saveHint.textContent = n ? 'ยังไม่ได้บันทึก · กดปุ่มด้านล่างครั้งเดียวเมื่อแก้ครบ' : 'แก้ได้หลายอย่าง แล้วกดบันทึกครั้งเดียว';
    saveHint.className = n ? 's warn' : 's';
    // สถานะที่จะเป็นหลังบันทึก
    const close = P.lost ? 'ไม่รักษา' : '';
    const first = S.find(s => effStatus(s) === 'รอ' && s.name.trim());
    const live = close || (c.status === 'ไม่รักษา' && !P.reopen ? c.status : first ? first.name : S.some(s => s.name.trim()) ? 'จบเคส' : 'รอแผนจากหมอ');
    liveSt.textContent = live;
    liveHint.textContent = live !== c.status ? '(หลังบันทึก · ตอนนี้ ' + c.status + ')' : '';
    liveDue.textContent = !close && first ? (first.wait ? 'รอ' + first.wait : '') + (first.due ? (first.wait ? ' · ' : '') + (first.due < today ? 'เลยกำหนด ' : 'ครบกำหนด ') + fmtDate(first.due) : '') : '';
  };
  const refresh = () => {
    renderSteps(); refreshBar();
    rsList.innerHTML = P.reserves.map((x, i) => `<div class="row"><div class="grow s warn">จะจอง: ${esc(x.label)} × ${esc(x.qty)}</div><button class="btn ghost small" type="button" data-rmres="${i}">เอาออก</button></div>`).join('');
    renderPick();
    rsList.querySelectorAll('[data-rmres]').forEach(b => b.onclick = () => { P.reserves.splice(+b.dataset.rmres, 1); refresh(); });
    app.querySelectorAll('[data-unres]').forEach(b => { const on = P.unres.has(b.dataset.unres); b.textContent = on ? 'จะยกเลิก ✓' : 'ยกเลิกจอง'; b.style.outline = on ? '3px solid var(--warn)' : ''; });
    lostNote.textContent = P.lost ? 'จะปิดเคสเป็น "ไม่รักษา" · เหตุผล: ' + P.lost + ' (กดอีกครั้งเพื่อยกเลิก)' : P.reopen ? 'จะเปิดเคสต่อ' : '';
  };
  const lostBtn = document.getElementById('lostBtn'), reopenBtn = document.getElementById('reopen');
  if (lostBtn) lostBtn.onclick = () => {
    if (P.lost) { P.lost = ''; return refresh(); }
    const why = (prompt('เหตุผลที่คนไข้ไม่รักษาต่อ (เช่น ราคา, ไปทำที่อื่น, ยังไม่พร้อม)', '') || '').trim();
    if (!why) return;
    P.lost = why; refresh();
  };
  if (reopenBtn) reopenBtn.onclick = () => { P.reopen = !P.reopen; refresh(); };
  // ตัวฟังเดียวต่อหน้า (ไม่สะสมทุกครั้งที่โหลดหน้าเคสใหม่)
  const tok = {}; app._caseTok = tok;
  app.oninput = app.onchange = e => { if (app._caseTok !== tok || !document.getElementById('stepList')) return; if (!e.target.closest('#stepList')) refreshBar(); };
  // ---- เลือกขั้นจากแม่แบบ (ติ๊กเลือก) · ไม่พอค่อยพิมพ์เอง ----
  const pkSel = new Set();
  const hasOpen = name => S.some(x => x.name.trim() === name && effStatus(x) === 'รอ');
  const pkSteps = () => (r.templateSteps || {})[pkTpl.value] || [];
  function renderPick() {
    if (pickBox.hidden) return;
    pkList.innerHTML = pkSteps().map((x, i) => { const have = hasOpen(x.name);
      return `<label style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line)${have ? ';opacity:.5' : ''}"><input type="checkbox" data-pk="${i}" ${pkSel.has(i) && !have ? 'checked' : ''} ${have ? 'disabled' : ''} style="width:20px;height:20px;margin-top:2px">
        <span><span class="t" style="font-size:15px">${i + 1}. ${esc(x.name)}</span><br><span class="s" style="font-size:12px">${x.wait ? 'รอ' + esc(x.wait) : ''}${x.days ? ' · ' + x.days + ' วัน' : ''}${have ? ' · มีในเคสแล้ว' : ''}</span></span></label>`; }).join('') || '<p class="s">แม่แบบนี้ยังไม่มีขั้น</p>';
    pkList.querySelectorAll('[data-pk]').forEach(cb => cb.onchange = () => { cb.checked ? pkSel.add(+cb.dataset.pk) : pkSel.delete(+cb.dataset.pk); });
  }
  const pkReset = (all) => { pkSel.clear(); if (all) pkSteps().forEach((x, i) => { if (!hasOpen(x.name)) pkSel.add(i); }); renderPick(); };
  const pkMine = t => String(c.work).includes(t);
  pkTpl.onchange = () => pkReset(!S.some(s => s.name.trim()) && pkMine(pkTpl.value));
  document.getElementById('addStep').onclick = () => { pickBox.hidden = !pickBox.hidden; if (!pickBox.hidden) { pkReset(!S.some(s => s.name.trim()) && pkMine(pkTpl.value)); pickBox.scrollIntoView({block: 'start', behavior: 'smooth'}); } };
  document.getElementById('pkAll').onclick = () => pkReset(true);
  document.getElementById('pkAdd').onclick = () => {
    const list = pkSteps(); const picked = [...pkSel].sort((a, b) => a - b).map(i => list[i]).filter(x => x && !hasOpen(x.name));
    if (!picked.length) return flash('ติ๊กเลือกขั้นก่อน');
    picked.forEach(x => S.push({id: 'new' + (++tmpN), isNew: true, name: x.name, wait: x.wait || '', due: '', status: 'รอ', line: pkTpl.value,
      note: x.wait === 'เวลา' && x.days ? 'รอ ' + x.days + ' วัน' : ''}));
    pkSel.clear(); pickBox.hidden = true; refresh();
    flash('เพิ่ม ' + picked.length + ' ขั้นแล้ว · ลาก ≡ เรียงได้ · กดบันทึกทั้งหมดเมื่อครบ', true);
  };
  document.getElementById('pkFreeBtn').onclick = () => {
    const name = pkFree.value.trim(); if (!name) return flash('พิมพ์ชื่อขั้นก่อน');
    const t = Object.values(r.templateSteps || {}).flat().find(x => x.name === name);
    S.push({id: 'new' + (++tmpN), isNew: true, name, wait: t ? t.wait : '', due: '', status: 'รอ', line: ''});
    pkFree.value = ''; refresh();
  };
  if (!pickBox.hidden) pkReset(pkMine(pkTpl.value));
  document.getElementById('rsBtn').onclick = () => {
    if (!rsCode.value) return flash('เลือกของที่จะจอง');
    P.reserves.push({code: rsCode.value, qty: rsQty.value, useDate: rsDate.value, label: rsCode.options[rsCode.selectedIndex].text.split(' (ว่าง')[0]});
    rsCode.value = ''; refresh();
  };
  app.querySelectorAll('[data-unres]').forEach(b => b.onclick = () => { const k = b.dataset.unres; P.unres.has(k) ? P.unres.delete(k) : P.unres.add(k); refresh(); });
  document.getElementById('back').onclick = () => {
    if (count() && !confirm('ยังไม่ได้บันทึก ' + count() + ' รายการ ออกเลยไหม?')) return;
    c.key ? viewPatient(c.key) : viewCases2();
  };
  document.getElementById('saveAll').onclick = async () => {
    if (S.some(s => s.isNew && !s.name.trim())) return flash('มีขั้นใหม่ที่ยังไม่ได้ตั้งชื่อ ใส่ชื่อหรือกด "เอาออก" ก่อน');
    const miss = surgMissing();
    if (miss.length) { const box = stepList.querySelector('[data-surgbox]'); if (box) box.scrollIntoView({behavior: 'smooth', block: 'center'}); return flash('ของที่ใช้ยังไม่ครบ: ' + miss.join(', ') + ' · ใช้ = เลือกของ · ไม่ใช้ = ติ๊ก'); }
    const line = (S.find(s => s.line) || {}).line || '';
    const body = {id, steps: Object.values(P.steps),
      stepEdits: S.filter(edited).map(s => ({id: s.id, name: s.name.trim(), wait: s.wait, due: s.due, note: s.note.trim(), owner: s.owner || ''})),
      adds: newOnes().map(s => ({tmp: s.id, name: s.name.trim(), wait: s.wait, due: s.due, line: s.line || line, note: s.note || '', owner: s.owner || ''})),
      order: orderChanged() ? S.map(s => s.id) : [],
      reserves: P.reserves, unres: [...P.unres], surgery: surgPayload()};
    if (caseChanged() || P.lost || P.reopen) {
      const d = caseChanged() ? {dn: cuDn.value, photoLink: cuPhoto.value} : {};
      if (P.lost) { d.status = 'ไม่รักษา'; d.lostReason = P.lost; } else if (P.reopen) d.status = 'เปิดเคสต่อ';
      body.update = d;
    }
    saveAll.disabled = true; saveAll.textContent = 'กำลังบันทึก…';
    const res = await call('caseSaveAll', body);
    if (!res.ok) { refreshBar(); return flash(errMore(res)); }
    casesCache = null; dirty = false;
    reload((res.errors && res.errors.length ? 'บันทึก ' + res.done + ' รายการ · ไม่สำเร็จ: ' + res.errors.join(', ') : 'บันทึกแล้ว ' + res.done + ' รายการ') + (res.status ? ' · สถานะ: ' + res.status : ''));
  };
  refresh();
}

    <div class="t">วันนี้ ${Object.keys(bills).length} คน · ${baht(sum.total)} บาท</div>

      viewDaily2('ยกเลิกแล้ว');

  document.getElementById('cl2').onsubmit = async ev => { ev.preventDefault();
    const b = ev.target.querySelector('button'); b.disabled = true;

  if (owner) bindOwnerReports();

  app.innerHTML = '<div class="center">กำลังโหลด…</div>';

  if (!r.ok) return showError('โหลดไม่ได้: ' + r.error);
  capDrafts = r.pending;
  const L = r.lists;
  app.innerHTML = `
    <div id="m">${note ? `<div class="msg ok">${esc(note)}</div>` : ''}</div>
    <div class="card"><div class="t">📷 ถ่ายเอกสารเข้าระบบ</div>

    ${r.done.length ? `<details class="card"><summary class="t" style="cursor:pointer">บันทึกแล้วล่าสุด (${r.done.length})</summary>${r.done.map(x => `<div class="s"><a href="${esc(x.url)}" target="_blank" rel="noopener">รูป</a> · ${esc(x.at)} · ${esc(x.by)} · ${esc(x.target)}</div>`).join('')}</details>` : ''}`;
  capIn.onchange = async () => {
    const files = [...capIn.files];
    for (let i = 0; i < files.length; i++) {
      capProg.textContent = `กำลังอ่านรูปที่ ${i + 1}/${files.length}…`;
      let data; try { data = await shrinkImage(files[i]); } catch (e) { flash(e.message); continue; }
      const up = await call('capUpload', { photos: [data] });
      if (!up.ok) { flash(errV2(up)); continue; }
      capDrafts.unshift({ id: up.id, url: up.url, kind: up.draft.kind, draft: up.draft, suggest: up.suggest, status: 'รอยืนยัน', ocr: up.ocr });

    capIn.value = '';
  };
  bindCapCards(L);
}

    ${kind === 'invoice' ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px"><div><label>คนไข้ (งานแล็บ)</label><input class="fPt" value="${esc(d.patient || '')}"></div>

      <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" class="fPaid" style="width:auto;height:auto"> ใบนี้จ่ายแล้ว (ใบเสร็จ)</label>` : ''}
    ${kind === 'billing' ? `<label>รายการในใบวางบิล (แก้ได้ · ใบที่บันทึกแยกไว้แล้วระบบผูกให้เอง)</label><div class="fLines">${(d.lines || []).map(l => lineRow(l, L)).join('')}</div>
      <button type="button" class="btn ghost small fAddLine">+ เพิ่มบรรทัด</button>` : ''}
    ${s.dup ? `<div class="s bad">⚠️ ${esc(s.dup)}</div>` : ''}`;
  if (kind === 'expense') return dt + `<label>ร้าน/ผู้รับ</label><input class="fVendor2" value="${esc(d.vendor || d.to || '')}">
    <label>รายการ</label><input class="fItems" value="${esc(d.note || '')}" placeholder="เช่น ถุงดำ ค่าส่งงานแล็บ แบตเตอรี่">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px"><div><label>หมวด</label><select class="fCat">${opts(['วัสดุทันตกรรม', 'ของใช้สิ้นเปลือง', 'ขนส่ง', 'ซ่อมบำรุง', 'ค่าแล็บ', 'อื่นๆ'], d.cat === 'ขนส่ง' ? 'ขนส่ง' : '')}</select></div>
      <div><label>ใครจ่าย</label><select class="fPayBy">${opts(L.payMethods, d.kind === 'slip_staff' ? 'สำรองจ่ายเอง' : '')}</select></div></div>`;
  if (kind === 'settlement') return dt + `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px"><div><label>จำนวนรายการ</label><input class="fCount" type="number" value="${d.count || ''}"></div><div><label>Batch</label><input class="fRef" value="${esc(d.ref || '')}"></div></div>`;
  return '<div class="s">เก็บรูปไว้ใน Drive อย่างเดียว</div>';
}
const lineRow = (l, L) => `<div class="fLine" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 6px;margin:4px 0;border-top:1px solid var(--border);padding-top:4px">
  <input class="lDate" type="date" value="${esc(l.date || '')}"><input class="lInv" placeholder="เลขใบกำกับ" value="${esc(l.inv || l.rx || '')}"><input class="lAmt" type="number" inputmode="decimal" placeholder="ยอด" value="${l.amount || ''}">
  <input class="lPt" placeholder="คนไข้" value="${esc(l.patient || '')}"><input class="lWork" placeholder="งาน" value="${esc(l.work || '')}"><select class="lDoc"><option value="">หมอ</option>${opts(L.doctors, l.doctor)}</select></div>`;
function capCard(c, L) {
  const d = c.draft || {}; d._id = c.id;
  const kind = kindOf(c.kind);
  return `<div class="card" data-cap="${esc(c.id)}">
    <div style="display:flex;gap:8px;align-items:center"><div class="t grow">${c.status === 'สลิปรอจับคู่' ? '🕓 สลิปรอจับคู่' : 'รอยืนยัน'} · <a href="${esc(c.url)}" target="_blank" rel="noopener">ดูรูป</a></div>
      ${c.ocr === false ? '<span class="pill" style="background:var(--warnbg);color:var(--warn)">อ่านไม่ออก พิมพ์เอง</span>' : ''}</div>
    <label>ประเภทเอกสาร</label><select class="fKind">${CAP_KINDS.map(([k, t]) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <div class="fBody">${capFields(kind, d, c.suggest || {}, L)}</div>
    <button class="btn fOk" style="width:100%;margin-top:10px">ยืนยัน</button></div>`;
}
function bindCapCards(L) {
  app.querySelectorAll('[data-cap]').forEach(el => {
    if (el.dataset.bound) return; el.dataset.bound = 1;
    const c = capDrafts.find(x => x.id === el.dataset.cap);
    const body = el.querySelector('.fBody');
    const bindLines = () => { const a = el.querySelector('.fAddLine'); if (a) a.onclick = () => el.querySelector('.fLines').insertAdjacentHTML('beforeend', lineRow({}, L)); };
    bindLines();
    el.querySelector('.fKind').onchange = e => { body.innerHTML = capFields(e.target.value, c.draft || {}, c.suggest || {}, L); bindLines(); };
    el.querySelector('.fOk').onclick = async () => {
      const kind = el.querySelector('.fKind').value, q = s => el.querySelector(s), v = s => q(s)?.value ?? '';
      let data = {};
      if (kind === 'slip_in') data = { date: v('.fDate'), amount: v('.fAmt'), ref: v('.fRef'), from: c.draft?.from, bills: [...el.querySelectorAll('.fBill:checked')].map(x => x.value) };
      if (kind === 'slip_out') data = { date: v('.fDate'), amount: v('.fAmt'), ref: v('.fRef'), method: v('.fMethod'), ids: (el.querySelector('.fPay:checked')?.value || '').split(',').filter(Boolean) };
      if (kind === 'invoice' || kind === 'billing') data = { vendor: v('.fVendor'), docNo: v('.fNo'), date: v('.fDate'), due: v('.fDue'), total: v('.fAmt'), vat: v('.fVat'), patient: v('.fPt'), doctor: v('.fDoc'), work: v('.fWork'), paid: !!q('.fPaid')?.checked,
        lines: [...el.querySelectorAll('.fLine')].map(x => ({ date: x.querySelector('.lDate').value, inv: x.querySelector('.lInv').value, amount: x.querySelector('.lAmt').value, patient: x.querySelector('.lPt').value, work: x.querySelector('.lWork').value, doctor: x.querySelector('.lDoc').value })) };
      if (kind === 'expense') data = { date: v('.fDate'), amount: v('.fAmt'), vendor: v('.fVendor2'), items: v('.fItems') || v('.fVendor2'), cat: v('.fCat'), pay: v('.fPayBy'), ref: c.draft?.ref };
      if (kind === 'settlement') data = { date: v('.fDate'), amount: v('.fAmt'), count: v('.fCount'), ref: v('.fRef') };
      const b = el.querySelector('.fOk'); b.disabled = true; b.textContent = 'กำลังบันทึก…';
      let res = await call('capConfirm', { id: c.id, kind, data });
      if (!res.ok && res.error === 'pay_mismatch' && confirm(res.msg)) res = await call('capConfirm', { id: c.id, kind, data: { ...data, force: true } });
      if (!res.ok && res.error === 'dup_slip' && confirm(res.msg + '\nยืนยันว่าใช้ซ้ำ?')) res = await call('capConfirm', { id: c.id, kind, data: { ...data, allowDup: true } });
      b.disabled = false; b.textContent = 'ยืนยัน';
      if (!res.ok) return flash(errV2(res));
      capDrafts = capDrafts.filter(x => x.id !== c.id); el.remove();
      flash(res.pending ? 'เก็บเป็นสลิปรอจับคู่แล้ว' : res.flags?.length ? 'บันทึกแล้ว · ตรวจ: ' + res.flags.join(' · ') : 'บันทึกแล้ว', true);
    };
  });
}

// ---------- เจ้าหนี้ (หมอ) ----------
