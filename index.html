<style>

<body>
<header><h1 id="title">เมนูทีม SMA</h1><div class="who" id="who">กำลังโหลด…</div></header>
<nav id="tabs" hidden aria-label="เมนู">
  <button data-tab="tasks">งานของฉัน</button>
  <button data-tab="checklist">งานค้าง</button>
  <button data-tab="appt">นัดหมาย</button>
  <button data-tab="cases">เคส</button>
  <button data-tab="stock">สต็อก</button>
  <button data-tab="lab">แล็บ</button>
  <button data-tab="buy">ซื้อของ</button>
  <button data-tab="cap">📷 ถ่ายรูป</button>
  <button data-tab="daily">สรุปรายวัน</button>
  <button data-tab="pay" data-owner>เจ้าหนี้</button>
  <button data-tab="payroll" data-owner>เงินเดือน</button>
  <button data-tab="df" data-doctor>DF</button>
  <button data-tab="team">ทีมงาน</button>
</nav>
<main id="app"><div class="center">กำลังเชื่อมต่อ LINE…</div></main>

<script>
const LIFF_ID = '2012153326-d5iUzPP3';
const API_URL = 'https://script.google.com/macros/s/AKfycbyFN3RzgA2ZQp1l_cTcCMc4qG1XwgeWvsmSHBVmR2uwl4zQ8wkFvdEdCMLR0_19tVdg/exec';

const app = document.getElementById('app');
const who = document.getElementById('who');
const tabs = document.getElementById('tabs');
let me = null, profile = null, stockItems = [];

// v54 ผลส่งคอนเฟิร์มนัดทาง LINE คนไข้
const cfNote = c => !c ? '' : ({sent: ' · ส่งคอนเฟิร์มทาง LINE ให้คนไข้แล้ว', no_line: ' · คนไข้ยังไม่ได้ผูก LINE จึงไม่ได้ส่งคอนเฟิร์ม', failed: ' · ⚠️ ส่ง LINE ให้คนไข้ไม่สำเร็จ' + (c.reason ? ' (' + c.reason + ')' : ''), off: ''}[c.status] || '');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = v => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? String(v) : d.toLocaleDateString('th-TH', {day:'numeric', month:'short'}); };

// ข้อมูลที่เปิดดูบ่อย: โชว์ของเดิมที่จำไว้ทันที แล้วดึงของใหม่ตามหลัง (ถ้าต่างและยังไม่ได้พิมพ์อะไร → วาดหน้าใหม่)
const READ_ACTIONS = new Set(['stockTree', 'dailyToday', 'apptDay', 'checklist', 'buyHome', 'stock', 'caseList', 'labs', 'myTasks', 'today', 'myRequests', 'pending',
  'teamList', 'payHome', 'payrollHome', 'slipInList', 'myCases', 'caseInfo', 'leaveHome', 'capHome', 'dfHome', 'reserved', 'myLabSteps', 'labPhotosHome', 'patients', 'tasksHome', 'patientInfo']);
const memGet = k => { try { return JSON.parse(localStorage.getItem('sma_c_' + k) || 'null'); } catch (e) { return null; } };
const memSet = (k, v) => { const s = JSON.stringify(v); try { localStorage.setItem('sma_c_' + k, s); } catch (e) { memClear(); try { localStorage.setItem('sma_c_' + k, s); } catch (e2) {} } };
const memClear = () => { try { Object.keys(localStorage).filter(k => k.startsWith('sma_c_')).forEach(k => localStorage.removeItem(k)); } catch (e) {} };
let dirty = false, lastWrite = 0;
document.addEventListener('input', () => { dirty = true; }, true);
const inFlight = new Map();
// ปุ่มคัดลอกทางไปโฟลเดอร์รูป (ใช้กับแอป DS file)
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); flash('คัดลอก ' + b.dataset.copy + ' แล้ว เปิด DS file แล้ววางในช่องค้นหา/ไปที่โฟลเดอร์', true); }
  catch (err) { prompt('คัดลอกทางไปโฟลเดอร์นี้', b.dataset.copy); }
});
async function api(action, data = {}) {
  if (!READ_ACTIONS.has(action)) {
    // กันกดซ้ำ: คำขอเดิมที่ยังส่งไม่เสร็จ → ใช้ผลเดียวกัน ไม่ส่งซ้ำ
    const fk = action + '|' + JSON.stringify(data).slice(0, 2000);
    if (inFlight.has(fk)) return inFlight.get(fk);
    const p = apiNet(action, data).finally(() => inFlight.delete(fk));
    inFlight.set(fk, p);
    const r = await p;
    // v45 บันทึกแล้วไม่ล้างของที่จำไว้ทั้งหมด (หน้าอื่นยังเปิดเร็ว แล้วดึงของใหม่ตามหลัง) · 8 วินาทีแรกหลังบันทึก ดึงของใหม่เสมอ
    if (r && r.ok && action !== 'me') lastWrite = Date.now();
    return r;
  }
  const key = (me ? me.nickname : '') + '|' + action + '|' + JSON.stringify(data);
  const cached = Date.now() - lastWrite < 8000 ? null : memGet(key);
  const fresh = apiNet(action, data).then(r => { if (r && r.ok) memSet(key, r); return r; });
  if (!cached) return fresh;
  const hashAt = location.hash;
  fresh.then(r => {
    if (r && r.ok && JSON.stringify(r) !== JSON.stringify(cached) && location.hash === hashAt && !dirty) route(true);
  }).catch(() => {});
  return cached;
}
// อ่านข้อมูล: ช้า/หลุด → ลองใหม่ให้เองอีก 1 ครั้ง (บันทึก/แก้ไข ไม่ลองซ้ำ กันข้อมูลเข้า 2 ครั้ง)
async function apiNet(action, data = {}) {
  try { return await apiOnce(action, data); }
  catch (e) {
    if (!READ_ACTIONS.has(action)) throw e;
    return await apiOnce(action, data);
  }
}
// v40.1 token LINE หมดอายุ (เปิดเมนูค้างไว้นาน) → ล็อกอินใหม่ให้เอง 1 ครั้ง ไม่ต้องให้คนกด
function reLogin() {
  try { const t = Number(sessionStorage.getItem('sma_relogin') || 0); if (Date.now() - t < 60000) return false; sessionStorage.setItem('sma_relogin', String(Date.now())); } catch (e) {}
  try { liff.logout(); } catch (e) {}
  liff.login({ redirectUri: location.href });
  return true;
}
function tokenExpired() {
  try { const d = liff.getDecodedIDToken(); return !d || (d.exp * 1000) < Date.now() + 60000; } catch (e) { return false; }
}
async function apiOnce(action, data = {}) {
  if (tokenExpired() && reLogin()) return new Promise(() => {});
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 40000);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action, idToken: liff.getIDToken(), ...data}),
      signal: ctrl.signal
    });
    const j = await res.json();
    if (j && j.error === 'invalid_token' && reLogin()) return new Promise(() => {});
    return j;
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'ระบบตอบช้าเกินไป ลองใหม่อีกครั้ง' : e.message);
  } finally {
    clearTimeout(timer);
  }
}

function showError(text) {
  app.innerHTML = `<div class="msg err">${esc(text)}</div><button class="btn ghost" onclick="location.reload()">ลองใหม่</button>`;
}

// ปุ่มริชเมนู: liff.line.me/ID?page=cases → LINE ส่งมาเป็น ?page= หรือ ?liff.state=%3Fpage%3Dcases (หรือ #cases)
function pageFromUrl() {
  const sp = new URLSearchParams(location.search);
  let p = sp.get('page');
  const st = sp.get('liff.state');
  if (!p && st) { const m = st.match(/[?&]page=([\w-]+)/) || st.match(/#([\w-]+)/) || st.match(/^\/?([\w-]+)$/); p = m && m[1]; }
  if (!p && location.hash) p = location.hash.slice(1);
  return p || '';
}
let START_PAGE = pageFromUrl();
// v49 ลิงก์จากแจ้งเตือนคำขอนัด: ?page=appt&req=RQ261105-01
function reqFromUrl() {
  const sp = new URLSearchParams(location.search);
  let q = sp.get('req');
  const st = sp.get('liff.state');
  if (!q && st) { const m = st.match(/[?&]req=([\w-]+)/); q = m && m[1]; }
  return q || '';
}
let REQ_FOCUS = reqFromUrl();
async function start() {
  try {
    await liff.init({liffId: LIFF_ID});
    START_PAGE = pageFromUrl() || START_PAGE;
    REQ_FOCUS = reqFromUrl() || REQ_FOCUS;
    if (!liff.isLoggedIn()) { liff.login({redirectUri: location.href}); return; }
    profile = await liff.getProfile().catch(() => null);
    app.innerHTML = '<div class="center">กำลังตรวจสอบสิทธิ์…</div>';
    const meKey = 'sma_me_' + (profile ? profile.userId : '');
    let saved = null; try { saved = JSON.parse(localStorage.getItem(meKey) || 'null'); } catch (e) {}
    if (saved) {
      // เคยเข้าแล้ว: เปิดเมนูทันที แล้วตรวจสิทธิ์ตามหลัง
      me = saved; enter();
      api('me').then(r => {
        if (r.ok) { me = r.staff; try { localStorage.setItem(meKey, JSON.stringify(r.staff)); } catch (e) {} return; }
        try { localStorage.removeItem(meKey); } catch (e) {}
        location.reload();
      }).catch(() => {});
      return;
    }
    const r = await api('me');
    if (r.ok) { me = r.staff; try { localStorage.setItem(meKey, JSON.stringify(r.staff)); } catch (e) {} return enter(); }
    if (r.error === 'not_approved' && r.staff && r.staff.status === 'รออนุมัติ') return waiting();
    if (r.error === 'not_approved' && r.staff && r.staff.status === 'ระงับ') { who.textContent = ''; return showError('บัญชีนี้ถูกระงับสิทธิ์ ติดต่อเจ้าของคลินิก'); }
    if (r.error === 'not_approved') return registerForm();
    if (r.error === 'invalid_token') { who.textContent = ''; return showError('ยืนยันตัวตนกับ LINE ไม่ผ่าน ลองปิดเมนูแล้วเปิดใหม่ (ถ้ายังไม่ได้ แจ้งหมอเดียร์)'); }
    showError('เชื่อมต่อระบบไม่ได้ (' + (r.error || 'ไม่ทราบสาเหตุ') + ')');
  } catch (e) {
    showError('เชื่อมต่อไม่สำเร็จ: ' + e.message);
  }
}

  if (Date.now() - lastBgSync < 45000) return;
  lastBgSync = Date.now();
  apiNet('calSync').then(r => { if (r && r.ok && r.changed) { memClear(); if ((location.hash.slice(1) || 'tasks') === page && !dirty) route(true); } }).catch(() => {});

function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('เครื่องนี้หาตำแหน่งไม่ได้'));
    navigator.geolocation.getCurrentPosition(
      p => resolve({lat: p.coords.latitude, lng: p.coords.longitude, acc: Math.round(p.coords.accuracy)}),
      e => reject(new Error(e.code === 1 ? 'ยังไม่ได้อนุญาตให้ LINE ใช้ตำแหน่ง ไปเปิดในตั้งค่าเครื่องแล้วลองใหม่' : 'หาตำแหน่งไม่ได้ ลองออกไปใกล้หน้าต่างแล้วกดใหม่')),
      {enableHighAccuracy: true, timeout: 15000, maximumAge: 0});
  });
}

      <div class="t">${esc(x.nickname)} · ${esc(x.type)}</div>
      <div class="s">${esc(x.date)}${x.dateTo && x.dateTo !== x.date ? ' ถึง ' + esc(x.dateTo) : ''}${x.start ? ' ' + esc(x.start) + '–' + esc(x.end) : ''}${x.place ? ' · ที่' + esc(x.place) : ''} · ${esc(x.reason)}</div></div>

async function viewStock() {

let stockMode = 'job', stockCatSel = '', stockCat = 'ทั้งหมด', stockReserved = {}, stockPath = [], stockGroups = [], stockUnits = [], stockEdit = '', stockSel = null, stockCond = '';
const SEP = ' › ';
// สต็อกเป็นชั้น v18: เส้นทางยืดหยุ่น (งาน › วัสดุ/อุปกรณ์ › หมวด › ยี่ห้อ › …) · กด + เพิ่มได้ทุกชั้น
const JOB_ORDER = ['งานศัลยกรรม', 'งานอุดฟัน / ความงาม', 'งานครอบ / สะพาน / วีเนียร์', 'งานรักษาราก', 'งานจัดฟัน', 'งานฟันปลอมถอดได้', 'แล็บ', 'ใช้ร่วมทุกงาน', 'ของขาย', 'ยังไม่จัดหมวด'];
function stockState(i) {
  const held = stockReserved[i['รหัสสินค้า']] || 0;
  const left = Number(i['คงเหลือ']) - held, hasReorder = String(i['จุดสั่งซื้อ']).trim() !== '', reorder = Number(i['จุดสั่งซื้อ']);
  const exp = i['วันหมดอายุใกล้สุด'] ? new Date(i['วันหมดอายุใกล้สุด']) : null;
  const soon30 = new Date(); soon30.setDate(soon30.getDate() + 30);
  return {held, left, hasReorder, exp, expSoon: !!(exp && !isNaN(exp) && exp <= soon30), low: hasReorder ? left <= reorder : left <= 0};
}
function allGroupPaths() {
  const set = new Set();
  const addP = p => { const parts = p.split(SEP); for (let k = 1; k <= parts.length; k++) set.add(parts.slice(0, k).join(SEP)); };
  stockItems.forEach(i => i.path && addP(i.path)); stockGroups.forEach(addP);
  return [...set].sort((a, b) => a.localeCompare(b, 'th'));
}
// v65 ดูตามหมวด: หมวด = ชั้นถัดจาก วัสดุ/อุปกรณ์ (ไม่มี = ชั้นแรก)
function stockCatOf(i) {
  const parts = String(i.path || '').split(SEP).filter(Boolean);
  if (parts.length >= 3 && (parts[1] === 'วัสดุ' || parts[1] === 'อุปกรณ์')) return parts[2];
  return parts[0] || 'ยังไม่จัดหมวด';
}
function renderStock(q) {

// ===== รูปถ่าย: ย่อให้เล็กก่อนส่ง =====
// ย่อรูปก่อนส่ง · ถ้าเบราว์เซอร์ใน LINE อ่านรูปไม่ได้ (เช่น HEIC) หรือค้าง → ส่งไฟล์เดิมแทน ไม่ให้ปุ่มค้าง
function readRaw(file) {
  return new Promise((resolve, reject) => {
    if (file.size > 8 * 1024 * 1024) return reject(new Error('รูปใหญ่เกินไป ลองแคปหน้าจอสลิปแล้วแนบใหม่'));
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result); fr.onerror = () => reject(new Error('อ่านรูปไม่ได้ ลองแคปหน้าจอแล้วแนบใหม่'));
    fr.readAsDataURL(file);
  });
}
function shrinkImage(file, max = 1600) {
  return Promise.race([shrinkCanvas(file, max), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000))])
    .catch(() => readRaw(file));
}
function shrinkCanvas(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => reject(new Error('อ่านรูปไม่ได้'));
    img.src = URL.createObjectURL(file);
  });
}

function labStepsHtml(l, steps) {

    const cur = !s.d && l.plan.findIndex(x => !x.d) === i, m = String(s.at || '').match(/^(\d{4})-(\d{2})-(\d{2})/);

  if (l.kind !== 'ในบ้าน' || !steps || !steps.length) return '';
  const hist = String(l.history || '').split('\n');

// v40.3 ติ๊กหลายรายการแล้วบันทึกครั้งเดียว (เหมือนหน้าเคส) ใช้กับ งานค้าง · ต้องซื้อ · สถานะนัด
const BATCH = { items: [] };
function batchInit(onDone) {
  BATCH.items = [];
  const bar = document.createElement('div');
  bar.id = 'batchBar'; bar.hidden = true;
  bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--card);border-top:1px solid var(--border);padding:10px 16px calc(10px + env(safe-area-inset-bottom))';
  bar.innerHTML = '<div class="s" style="text-align:center;margin-bottom:6px">ติ๊กได้หลายรายการ แล้วกดบันทึกครั้งเดียว</div><div style="display:flex;gap:8px"><button class="btn ghost" type="button" data-bclr style="flex:1">ล้าง</button><button class="btn" type="button" data-bsave style="flex:2">บันทึก</button></div>';
  app.appendChild(bar);
  const pad = document.createElement('div'); pad.style.height = '90px'; app.appendChild(pad);
  bar.querySelector('[data-bclr]').onclick = () => { BATCH.items.slice().forEach(x => batchUndo(x)); };
  bar.querySelector('[data-bsave]').onclick = async ev => {
    const b = ev.target; if (!BATCH.items.length) return;
    b.disabled = true; const all = BATCH.items.slice(); let done = 0; const errs = [];
    b.textContent = 'กำลังบันทึก 0/' + all.length;
    const queue = all.slice();
    const worker = async () => { while (queue.length) { const x = queue.shift(); const r = await x.fn().catch(e => ({ ok: false, error: e.message })); done++; b.textContent = 'กำลังบันทึก ' + done + '/' + all.length; if (!r || !r.ok) errs.push(x.label + ': ' + ((r && (r.msg || r.error)) || 'ไม่สำเร็จ')); } };
    await Promise.all([worker(), worker(), worker()]);
    dirty = false; BATCH.items = [];
    onDone((all.length - errs.length) + ' รายการบันทึกแล้ว' + (errs.length ? ' · ไม่สำเร็จ ' + errs.length + ': ' + errs.join(' / ') : ''), !errs.length);
  };
}
function batchAdd(rowEl, label, fn) {
  if (!rowEl || rowEl.dataset.bq) return;
  const x = { rowEl, label, fn };
  BATCH.items.push(x); rowEl.dataset.bq = '1';
  rowEl.querySelectorAll('button').forEach(b => { b.dataset.bdis = b.disabled ? '1' : ''; b.disabled = true; });
  rowEl.style.background = '#eef7f1';
  const tag = document.createElement('div'); tag.className = 's bq'; tag.style.cssText = 'width:100%;color:var(--ok,#1a7f4b);margin-top:4px';
  tag.innerHTML = '✓ ' + esc(label) + ' (ยังไม่บันทึก) · <a href="#" style="color:inherit">ยกเลิก</a>';
  tag.querySelector('a').onclick = e => { e.preventDefault(); batchUndo(x); };
  rowEl.appendChild(tag); x.tag = tag;
  batchCount();
}
function batchUndo(x) {
  BATCH.items = BATCH.items.filter(y => y !== x);
  delete x.rowEl.dataset.bq; x.rowEl.style.background = ''; if (x.tag) x.tag.remove();
  x.rowEl.querySelectorAll('button').forEach(b => { b.disabled = b.dataset.bdis === '1'; });
  batchCount();
}
function batchCount() {
  const bar = document.getElementById('batchBar'); if (!bar) return;
  bar.hidden = !BATCH.items.length; dirty = BATCH.items.length > 0;
  bar.querySelector('[data-bsave]').textContent = 'บันทึก ' + BATCH.items.length + ' รายการ';
}

      ${b.photos?.length ? `<div class="s">${b.photos.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">ดูรูป ${i + 1}</a>`).join(' · ')}</div>` : ''}</div>
      <button class="btn small" data-dec="อนุมัติ" data-id="${esc(b.id)}">อนุมัติ</button>
      <button class="btn ghost small" data-dec="ไม่อนุมัติ" data-id="${esc(b.id)}">ไม่อนุมัติ</button></div>`).join('')}</div>` : ''}
    <details class="card" ${note === 'open' ? 'open' : ''}><summary class="t" style="cursor:pointer">+ บันทึกบิลซื้อของ / ค่าซ่อม</summary>
      <form id="bf">
        <div class="cats" style="margin-top:10px" role="group" aria-label="ประเภท">

        <div id="bfEquipBox" hidden><label for="bfEquip">ซ่อมอะไร / จุดไหน</label><input id="bfEquip" placeholder="เช่น แอร์ห้องรอ, ด้ามกรอยูนิตบน"></div>
        <label for="bfAmt">ยอดรวม (บาท)</label><input id="bfAmt" type="number" inputmode="decimal" min="1" required>
        <p class="note" id="bfLimit" hidden>เกิน ${baht(r.limit)} บาท ต้องให้หมออนุมัติก่อน · กดส่งคำขอได้เลย ยังไม่ต้องแนบบิล ซื้อแล้วค่อยกลับมาแนบ</p>
        <label for="bfVendor">ร้าน / ผู้ขาย</label><input id="bfVendor" list="vendors" placeholder="เช่น Shopee, KTDS, ดีฟาร์มาซี">
        <datalist id="vendors">${r.vendors.map(v => `<option value="${esc(v)}">`).join('')}</datalist>
        <label for="bfCat">หมวด</label><select id="bfCat">${opts(r.cats)}</select>

      ${owner ? `<form id="ca" class="move"><div class="grow"><label for="caAmt">หมอเติมเงินเข้า (บาท)</label><input id="caAmt" type="number" inputmode="decimal" min="1" required></div><button class="btn small" type="submit">เติมเงิน</button></form>` : ''}

    <div class="t">บิลของฉันล่าสุด</div>
    <div class="list">${r.mine.length ? r.mine.map(billRow).join('') : '<div class="row s">ยังไม่มีบิล</div>'}</div>`;

  const tbReload = m => viewBuy().then(() => m && flash(m, true));

  app.querySelectorAll('[data-tbdel]').forEach(b => b.onclick = () => batchAdd(b.closest('.row'), 'เอาออกจากลิสต์', () => call('buyListDone', {id: b.dataset.tbdel, status: 'ยกเลิก'})));
  app.querySelectorAll('[data-tbsug]').forEach(b => b.onclick = async () => { b.disabled = true; const x = await call('buyListAdd', {code: b.dataset.tbsug, src: b.dataset.why}); if (!x.ok) { b.disabled = false; return flash(errMore(x)); } tbReload('ใส่ลิสต์แล้ว'); });
  document.getElementById('tbAdd').onclick = async () => {
    const name = tbName.value.trim(); if (!name) return flash('ใส่ชื่อของก่อน');

    const b = document.getElementById('tbAdd'); b.disabled = true;
    const x = await call('buyListAdd', {code: hit ? hit.code : '', name: hit ? '' : name, qty: tbQty.value, note: tbNote.value});

    tbReload('ใส่รายการต้องซื้อแล้ว');
  };
  let kind = 'ซื้อของ';
  const amt = document.getElementById('bfAmt');
  const sync = () => {
    const over = !owner && Number(amt.value) > r.limit;
    document.getElementById('bfLimit').hidden = !over;
    document.getElementById('bfPayBox').hidden = over;
    document.getElementById('bfBtn').textContent = over ? 'ส่งคำขออนุมัติ' : 'บันทึกบิล';
    document.querySelector('label[for=bfPhotos]').textContent = over ? 'รูปของที่จะซื้อ / ใบเสนอราคา / แชทร้าน (ถ้ามี ให้หมอดูตอนอนุมัติ)' : 'รูปบิล/ใบเสร็จ/สลิป (เลือกได้หลายรูป)';

    sync();
  });
  document.getElementById('bf').onsubmit = async ev => {
    ev.preventDefault();
    const btn = document.getElementById('bfBtn'); btn.disabled = true; btn.textContent = 'กำลังส่ง…';
    let photos = [];
    try { photos = await photosOf(document.getElementById('bfPhotos')); } catch (e) { btn.disabled = false; sync(); return flash(e.message); }
    const bbody = {kind, items: bfItems.value, amount: amt.value, vendor: bfVendor.value, cat: bfCat.value, pay: bfPay.value,
      photos, noReceipt: bfNoRc.checked, code: bfCode.value, qty: bfQty.value, equip: bfEquip.value, note: bfNote.value};
    let res = await call('buyCreate', bbody);
    if (!res.ok && res.error === 'dup_bill' && confirm('⚠️ ' + res.msg)) res = await call('buyCreate', {...bbody, allowDupBill: true});
    if (!res.ok) { btn.disabled = false; sync(); return flash(errMore(res)); }
    await viewBuy(); flash(res.needApprove ? 'ส่งคำขอให้หมออนุมัติแล้ว' : 'บันทึกบิลแล้ว', true);
  };
  app.querySelectorAll('[data-dec]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const res = await call('buyDecide', {id: b.dataset.id, decision: b.dataset.dec});
    if (!res.ok) { b.disabled = false; return flash(errMore(res)); }
    await viewBuy(); flash(b.dataset.dec === 'อนุมัติ' ? 'อนุมัติแล้ว ระบบแจ้งคนขอทาง LINE' : 'ไม่อนุมัติแล้ว', true);
  });
  app.querySelectorAll('[data-done]').forEach(b => b.onclick = () => {
    const box = b.parentElement.querySelector('.doneBox');
    box.innerHTML = `<form><label>ยอดจริง (บาท)</label><input class="dAmt" type="number" value="${esc(b.dataset.amt)}">
      <label>จ่ายด้วย</label><select class="dPay"><option value="">เลือก</option>${opts(r.payMethods)}</select>
      <label>รูปบิล/ใบเสร็จ</label><input class="dPh" type="file" accept="image/*" multiple>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input class="dNo" type="checkbox" style="width:auto;height:auto"> ไม่มีใบเสร็จ</label>
      <button class="btn small" type="submit" style="width:100%;margin-top:8px">บันทึก</button></form>`;
    box.querySelector('form').onsubmit = async ev => {
      ev.preventDefault(); const sb = box.querySelector('button'); sb.disabled = true; sb.textContent = 'กำลังส่ง…';
      const photos = await photosOf(box.querySelector('.dPh')).catch(() => []);
      const res = await call('buyDone', {id: b.dataset.done, amount: box.querySelector('.dAmt').value, pay: box.querySelector('.dPay').value, photos, noReceipt: box.querySelector('.dNo').checked});
      if (!res.ok) { sb.disabled = false; sb.textContent = 'บันทึก'; return flash(errMore(res)); }
      await viewBuy(); flash('แนบบิลแล้ว', true);
    };
  });
  app.querySelectorAll('[data-pay]').forEach(b => b.onclick = async () => {
    b.disabled = true;
    const res = await call('reimburse', {who: b.dataset.pay});
    if (!res.ok) { b.disabled = false; return flash(errMore(res)); }
    await viewBuy(); flash(`จ่ายคืน ${b.dataset.pay} ${baht(res.total)} บาท (${res.count} บิล) เงินกองกลางเหลือ ${baht(res.balance)}`, true);
  });
  const cc = document.getElementById('cc');
  if (cc) cc.onsubmit = async ev => { ev.preventDefault();
    const res = await call('cashCount', {counted: ccAmt.value});
    if (!res.ok) return flash(errMore(res));
    await viewBuy(); flash(res.diff === 0 ? 'นับตรงกับระบบ' : `ไม่ตรง ต่าง ${baht(res.diff)} บาท ระบบแจ้งหมอแล้ว`, res.diff === 0);
  };
  const ca = document.getElementById('ca');
  if (ca) ca.onsubmit = async ev => { ev.preventDefault();
    const res = await call('cashAdd', {amount: caAmt.value});
    if (!res.ok) return flash(errMore(res));
    await viewBuy(); flash('เติมเงินแล้ว คงเหลือ ' + baht(res.balance), true);
  };
}

    box.querySelector('form').onsubmit = async ev => { ev.preventDefault();

      let slips = [];

      const res = await call('dailySlip', {id: b.dataset.slip, slips});
      if (!res.ok) { sb.disabled = false; return flash(errMore(res)); }

    const res = await call('dailyClose', {counted: clAmt.value});

  if (owner) {

    rpBtn.onclick = async () => {

// ---------- เคส + แผนการรักษา + จองของ ----------
let caseStage = 'ทั้งหมด';
async function viewCases2() {
  app.innerHTML = '<div class="center">กำลังโหลดเคส…</div>';
  const r = await call('caseList');
  if (!r.ok) return showError('โหลดเคสไม่ได้: ' + r.error);
  casesCache = r.cases.map(c => ({id: c.id, name: c.name, work: c.work}));
  const owner = me.role === 'owner';
  // กลุ่มตามสิ่งที่เคสรออยู่ (สถานะ = ขั้นแรกที่ยังรอ)
  const grp = c => c.status === 'รอแผนจากหมอ' ? 'รอแผนจากหมอ' : c.overdue ? 'เลยกำหนด' : c.wait ? 'รอ' + c.wait : 'อื่นๆ';
  const groups = [...new Set(r.cases.map(grp))];
  if (caseStage !== 'ทั้งหมด' && !groups.includes(caseStage)) caseStage = 'ทั้งหมด';
  const list = r.cases.filter(c => caseStage === 'ทั้งหมด' || grp(c) === caseStage);
  // v19: รวมงานของคนไข้คนเดียวกันเป็นการ์ดเดียว · บรรทัดละงาน: งาน · นัดครั้งต่อไป · สถานะ
  const patientCards = jobs => {
    const keys = [...new Set(jobs.map(c => c.key))];
    if (!keys.length) return '<div class="card s">ไม่มีเคสในกลุ่มนี้</div>';
    return keys.map(k => { const js = jobs.filter(c => c.key === k), p = js[0];
      return `<div class="card pcard" style="padding:10px 12px">
        <div style="display:flex;align-items:center;gap:8px"><button type="button" data-pt="${esc(k)}" style="all:unset;cursor:pointer;flex:1;font-weight:700;font-size:16px">${esc(p.dn ? p.dn + ' ' : '')}${esc(p.name)} <span class="s" style="font-weight:400">›</span></button>
          <button class="btn ghost small" type="button" data-addjob="${esc(k)}" aria-label="เพิ่มงานให้ ${esc(p.name)}">＋</button></div>
        <div class="s" style="font-size:13px;margin:2px 0 4px">${ptApptLine(p, k)}</div>
        ${js.map(jobLine).join('')}</div>`; }).join('');
  };
  app.innerHTML = `
    <div id="m"></div>
    <details class="card"><summary class="t" style="cursor:pointer">+ เปิดเคสใหม่</summary>
      <form id="nc">
        <label for="ncName">ชื่อเล่นคนไข้</label><input id="ncName" required placeholder="ชื่อเล่นหรือชื่อต้น ไม่ใส่นามสกุล">
        <label for="ncDn">DN (ถ้ามีแล้ว)</label><input id="ncDn" list="pts2">
        <datalist id="pts2">${r.patients.map(p => `<option value="${esc(p.dn)}">${esc(p.nick)}</option>`).join('')}</datalist>
        <label for="ncDoc">หมอ</label><select id="ncDoc" required><option value="">เลือกหมอ</option>${opts(r.doctors)}</select>
        <label>งาน (เลือกได้หลายอย่าง · ขั้นตอนใส่ให้ตามแม่แบบ)</label><div class="cats" id="ncWorks" role="group" aria-label="งาน">${r.templates.map(t => `<button type="button" data-work="${esc(t)}" aria-pressed="false">${esc(t)}</button>`).join('')}</div>
        <label for="ncOther">งานอื่น (ถ้าไม่มีในรายการ)</label><input id="ncOther" placeholder="เช่น ฟอกสีฟัน">
        <label for="ncTooth">ซี่ฟัน</label><input id="ncTooth" placeholder="เช่น 36 หรือ 11 21 หรือ 13-23">
        <button class="btn" type="submit" style="width:100%;margin-top:12px">เปิดเคส</button>
      </form></details>
    <div class="cats" role="group" aria-label="สถานะ">${['ทั้งหมด', ...groups].map(s => `<button type="button" data-st="${esc(s)}" aria-pressed="${s === caseStage}">${esc(s)} ${s === 'ทั้งหมด' ? r.cases.length : r.cases.filter(c => grp(c) === s).length}</button>`).join('')}</div>
    ${patientCards(list)}
    <button class="btn ghost small" id="recallCases" type="button">กลุ่มรีคอล 6 เดือน</button>
    <div id="recallList"></div>
    <button class="btn ghost small" id="allCases" type="button">ดูเคสที่จบแล้ว / ไม่รักษา</button>
    <p class="note">ใช้ DN + ชื่อเล่นเท่านั้น ไม่ใส่นามสกุลหรือเบอร์โทร</p>`;
  app.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { caseStage = b.dataset.st; viewCases2(); });
  app.querySelectorAll('[data-case]').forEach(el => el.onclick = () => viewCase2(el.dataset.case));
  app.querySelectorAll('[data-pt]').forEach(el => el.onclick = () => viewPatient(el.dataset.pt));
  app.querySelectorAll('[data-addjob]').forEach(el => el.onclick = () => viewPatient(el.dataset.addjob, {add: true}));
  document.getElementById('recallCases').onclick = async () => {
    const box = document.getElementById('recallList'); box.innerHTML = '<div class="s">กำลังโหลด…</div>';
    const all = await call('caseList', {all: true}).catch(e => ({ok:false, error:e.message}));
    if (!all.ok) { box.textContent = 'โหลดกลุ่มรีคอลไม่ได้: ' + (all.error || 'ลองใหม่'); return; }
    const rows = (all.cases || []).filter(c => c.status === 'รีคอล 6 เดือน').sort((a,b) => (a.recallDate || '9999').localeCompare(b.recallDate || '9999'));
    box.innerHTML = '<div class="list">' + (rows.map(c => `<div class="row" data-case="${esc(c.id)}" style="cursor:pointer"><div class="grow"><div class="t">${esc(c.dn || '')} ${esc(c.name)} · ${esc(c.work)}</div><div class="s">รักษาเสร็จ ${fmtDate(c.completedDate)} · รีคอล ${fmtDate(c.recallDate)}</div></div><span class="pill">${c.recallDate && c.recallDate <= new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Bangkok'}) ? 'ถึงรอบรีคอล' : 'รีคอล 6 เดือน'}</span></div>`).join('') || '<div class="row s">ยังไม่มีคนไข้ในกลุ่มรีคอล</div>') + '</div>';
    box.querySelectorAll('[data-case]').forEach(el => el.onclick = () => viewCase2(el.dataset.case));
  };
  document.getElementById('allCases').onclick = async () => {
    const all = await call('caseList', {all: true});
    const closed = (all.cases || []).filter(c => ['จบเคส', 'ไม่รักษา', 'รีคอล 6 เดือน'].includes(c.status));
    app.insertAdjacentHTML('beforeend', `<div class="list">${closed.map(c => `<div class="row" data-case="${esc(c.id)}" style="cursor:pointer"><div class="grow"><div class="t">${esc(c.name)} · ${esc(c.work)}</div><div class="s">${esc(c.id)}${c.lostReason ? ' · ' + esc(c.lostReason) : ''}</div></div><span class="pill">${esc(c.status)}</span></div>`).join('') || '<div class="row s">ไม่มี</div>'}</div>`);
    app.querySelectorAll('[data-case]').forEach(el => el.onclick = () => viewCase2(el.dataset.case));
  };
  app.querySelectorAll('#ncWorks [data-work]').forEach(b => b.onclick = () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'));
  document.getElementById('nc').onsubmit = async ev => {
    ev.preventDefault();
    const works = [...app.querySelectorAll('#ncWorks [aria-pressed="true"]')].map(x => x.dataset.work);
    if (!works.length && !ncOther.value.trim()) return flash('เลือกงานอย่างน้อย 1 อย่าง หรือพิมพ์ในช่องงานอื่น');
    const b = ev.target.querySelector('button[type=submit]'); b.disabled = true;
    const res = await call('caseNew', {name: ncName.value, dn: ncDn.value, doctor: ncDoc.value, works, work: ncOther.value.trim(), tooth: ncTooth.value.trim(),});
    if (!res.ok) { b.disabled = false; return flash(errMore(res)); }
    casesCache = null; await viewCases2(); flash('เปิดเคส ' + res.id + ' แล้ว', true);
  };
}

// บรรทัดงานในการ์ดคนไข้: งาน · นัดครั้งต่อไป · สถานะ
function jobLine(c) {
  JOBS[c.id] = c;
  // v19i: คนไข้ 1 คน ใช้นัดเดียว · บรรทัดงานบอกแค่ว่างานนี้อยู่ในนัดครั้งหน้าไหม
  const ap = c.ptAppt ? (c.inAppt ? '<span style="color:var(--ok,#1a7f4b)">✓ ทำในนัดครั้งหน้า</span>' : '<span class="s">ยังไม่ได้ติ๊กในนัดครั้งหน้า</span>') : '';
  const lab = /แล็บ/.test(c.status + ' ' + (c.wait || ''));
  const pillAttr = lab ? (c.labId ? `data-golab="${esc(c.labId)}"` : `data-newlab="${esc(c.id)}"`) : '';
  const due = c.due ? ` · <span class="bad" style="font-weight:600">${c.overdue ? 'เลยกำหนด' : 'ครบ'} ${fmtDate(c.due)}</span>` : '';
  return `<div class="row" data-case="${esc(c.id)}" style="cursor:pointer;padding:8px 0;border-top:1px solid var(--line);margin:0;background:none;box-shadow:none;border-radius:0">
    <div class="grow" style="min-width:0"><div class="t" style="font-size:15px">${esc(c.work)}</div>
      <div class="s" style="font-size:12px">${ap}${ap && due ? '' : ''}${due ? (ap ? due : due.replace(/^ · /, '')) : ''}${c.flags && c.flags.some(f => f.startsWith('มีของ')) ? ' · <span class="bad">รอของ</span>' : ''}</div></div>
    ${pillAttr ? `<button type="button" class="pill" ${pillAttr} style="border:0;cursor:pointer;max-width:42%;white-space:normal;text-align:center;text-decoration:underline;${c.overdue ? 'background:var(--badbg);color:var(--bad)' : ''}">${esc(c.status)} ›</button>`
      : `<span class="pill" style="max-width:42%;white-space:normal;text-align:center;${c.overdue ? 'background:var(--badbg);color:var(--bad)' : ''}">${esc(c.status)}</span>`}<span class="s" style="padding-left:4px">›</span></div>`;
}
function ptApptLine(p, key) {
  const a = p.ptAppt;
  return a ? `📅 นัดครั้งหน้า <b>${fmtDate(a.date)} ${esc(String(a.start || '').slice(0, 5))}</b>${a.unit ? ' · ' + esc(a.unit) : ''}${a.work ? ' · ' + esc(a.work) : ''}`
    : `<button type="button" data-mkpt="${esc(key)}" style="all:unset;cursor:pointer;color:var(--bad);font-weight:600;text-decoration:underline">ยังไม่ได้นัด · กดลงนัด</button>`;
}
// v19j: กดลิงก์รูป (Google Drive) → เปิดดูในเมนูเลย ไม่ต้องล็อกอิน Drive · owner + คนส่งเท่านั้น
document.addEventListener('click', async e => {
  const a = e.target.closest('a[href*="drive.google.com"]'); if (!a || a.dataset.raw) return;
  e.preventDefault(); e.stopPropagation();
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px';
  ov.innerHTML = '<button type="button" aria-label="ปิด" style="position:absolute;top:10px;right:12px;font-size:28px;color:#fff;background:none;border:0;cursor:pointer">✕</button><div style="color:#fff">กำลังเปิดรูป…</div>';
  const close = () => ov.remove();
  ov.querySelector('button').onclick = close; ov.onclick = ev => { if (ev.target === ov) close(); };
  document.body.appendChild(ov);
  const r = await call('photoView', {url: a.href}).catch(err => ({ok: false, error: err.message}));
  if (!ov.isConnected) return;
  if (!r.ok) { ov.querySelector('div').innerHTML = r.error === 'forbidden' ? 'รูปนี้ดูได้เฉพาะ owner และคนที่ส่งรูป' : `เปิดรูปในเมนูไม่ได้ · <a href="${a.href}" target="_blank" rel="noopener" style="color:#9cf">เปิดใน Drive</a>`; return; }
  const box = ov.querySelector('div');
  box.style.cssText = 'width:100%;height:100%;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom';
  box.innerHTML = r.type === 'application/pdf' ? `<iframe src="${r.data}" style="width:100%;height:100%;border:0;background:#fff" title="เอกสาร"></iframe>` : `<img src="${r.data}" alt="รูปเอกสาร" style="max-width:100%;max-height:100%;object-fit:contain">`;
}, true);
// v19b: กดสถานะรอแล็บ → ไปงานแล็บนั้น · กด "ยังไม่ได้นัด" → ไปลงนัด (เติม DN + ติ๊กงานให้)
const JOBS = {};
let pendingAppt = null, openLabNew = null;
document.addEventListener('click', e => {
  const g = e.target.closest('[data-golab],[data-newlab],[data-mkappt],[data-mkpt]'); if (!g) return;
  e.preventDefault(); e.stopPropagation();
  if (g.dataset.golab) { openLabId = g.dataset.golab; if (location.hash === '#lab') route(); else location.hash = 'lab'; return; }
  if (g.dataset.newlab) { openLabNew = g.dataset.newlab; location.hash = 'lab'; return; }
  if (g.dataset.mkpt) { const js = Object.values(JOBS).filter(j => j.key === g.dataset.mkpt && !['จบเคส', 'ไม่รักษา'].includes(j.status)); if (!js.length) return;
    pendingAppt = {dn: js[0].dn || '', nick: js[0].name, doctor: js[0].dentist, caseId: js.map(j => j.id).join(',')}; location.hash = 'appt'; return; }
  const c = JOBS[g.dataset.mkappt]; if (!c) return;
  pendingAppt = {dn: c.dn || '', nick: c.name, doctor: c.dentist, caseId: c.id}; location.hash = 'appt';
}, true);

// ---------- หน้าภาพรวมคนไข้ (v19): ทุกงาน + ของที่ต้องเตรียมรวม + หมายเหตุ ----------
async function viewPatient(key, o = {}) {
  app.innerHTML = '<div class="center">กำลังโหลด…</div>';

      stepEdits: S.filter(edited).map(s => ({id: s.id, name: s.name.trim(), wait: s.wait, due: s.due, note: s.note.trim(), owner: s.owner || ''})),
      adds: newOnes().map(s => ({tmp: s.id, name: s.name.trim(), wait: s.wait, due: s.due, line: s.line || line, note: s.note || '', owner: s.owner || ''})),
      order: orderChanged() ? S.map(s => s.id) : [],
      reserves: P.reserves, unres: [...P.unres], surgery: surgPayload()};
    if (caseChanged() || P.lost || P.reopen || P.recall) {

      if (P.lost) { d.status = 'ไม่รักษา'; d.lostReason = P.lost; } else if (P.recall) d.status = 'รีคอล 6 เดือน'; else if (P.reopen) d.status = 'เปิดเคสต่อ';

}

    const id = el.dataset.fl, f = r.follow.find(x => x.id === id), box = el.querySelector('.flBox');
    el.querySelector('[data-fnew]').onclick = () => {
      apNew.open = true; af.dataset.from = id;
      afDn.value = f.dn || ''; afNick.value = f.nick; if (r.doctors.includes(f.doctor)) afDoc.value = f.doctor; afWork.value = f.work;
      afTooth.value = f.tooth || ''; afCase.value = f.caseId || ''; if (window._renderJobs) window._renderJobs();
      if (r.units.includes(f.unit)) pickUnit(f.unit);
      flash('เลือกวันเวลาใหม่ แล้วกดลงนัด รายการรอนัดใหม่จะปิดให้เอง', true); apNew.scrollIntoView({behavior: 'smooth'});
    };
    el.querySelector('[data-fsn]').onclick = () => {
      const d = new Date(); d.setDate(d.getDate() + 7);
      box.innerHTML = `<form><div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px">
        <div><label>โทรอีกครั้งวันที่</label><input type="date" class="sDate" value="${d.toLocaleDateString('en-CA')}" required></div>
        <div><label>คุยว่าอะไร</label><input class="sNote" placeholder="เช่น ขอโทรกลับต้นเดือน"></div></div>
        <button class="btn small" type="submit" style="width:100%;margin-top:8px">บันทึก</button></form>`;
      box.querySelector('form').onsubmit = async ev => { ev.preventDefault();
        const res = await call('apptFollow', {id, op: 'snooze', date: box.querySelector('.sDate').value, note: box.querySelector('.sNote').value});
        if (!res.ok) return flash(errMore(res));
        viewAppt('follow');
      };
    };
    el.querySelector('[data-fcl]').onclick = () => {
      box.innerHTML = `<form class="move"><div class="grow"><label>เหตุผลที่ปิด</label><input required class="cNote" placeholder="เช่น ไปรักษาที่อื่น โทรไม่ติด 3 ครั้ง"></div><button class="btn small" type="submit">ปิดรายการ</button></form>`;
      box.querySelector('form').onsubmit = async ev => { ev.preventDefault();
        const res = await call('apptFollow', {id, op: 'close', note: box.querySelector('.cNote').value});
        if (!res.ok) return flash(errMore(res));
        viewAppt('follow');
      };
    };
  });
}

  host.innerHTML = `<div class="card"><div class="t">📩 สลิปจาก LINE หน้าบ้าน รอหมอดู (${r.items.length})</div>
    ${r.items.map(x => `<div class="row" style="flex-wrap:wrap;align-items:flex-start"><div class="grow">
      <div class="t" style="font-size:15px">${baht(x.amount)} บาท · ${esc(x.date || x.at)} ${esc(x.time || '')}</div>
      <div class="s">${esc(x.from || 'ไม่ทราบชื่อผู้โอน')}${x.ref ? ' · ' + esc(x.ref) : ''} · ${x.status === 'หลายรายการ' ? 'ยอดตรงหลายรายการ' : x.status === 'ส่งซ้ำ' ? 'คนไข้ส่งสลิปเดิมซ้ำ' : x.status === 'ตรวจบัญชี' ? '⚠️ ไม่เห็นชื่อบัญชีคลินิกในสลิป' : 'ยังไม่มีรายการยอดนี้'}${x.url ? ` · <a href="${esc(x.url)}" target="_blank" rel="noopener">ดูสลิป</a>` : ''}</div>
      ${x.options.length ? `<select data-sk="${esc(x.id)}" style="margin-top:6px"><option value="">แนบกับรายการ…</option>${x.options.map(o => `<option value="${esc(o.key)}">${esc(o.date)} · ${esc(o.dn)} ${esc(o.nick)} · โอน ${baht(o.transfer)}${o.transfer !== x.amount ? ' (ยอดไม่ตรง)' : ''}</option>`).join('')}</select>` : ''}
      </div><button class="btn ghost" data-sx="${esc(x.id)}">ไม่เกี่ยว</button></div>`).join('')}
    <p class="s">ระบบจะลองจับคู่ให้อีกเมื่อเคาน์เตอร์ลงรายการยอดเดียวกัน</p></div>`;
  host.querySelectorAll('[data-sk]').forEach(s => s.onchange = async () => { if (!s.value) return; const res = await call('slipInMatch', { id: s.dataset.sk, key: s.value }); if (!res.ok) return flash('แนบไม่ได้: ' + res.error); viewDaily2('แนบสลิปแล้ว'); });
  host.querySelectorAll('[data-sx]').forEach(b => b.onclick = async () => { const res = await call('slipInMatch', { id: b.dataset.sx, dismiss: true }); if (!res.ok) return flash('ไม่สำเร็จ: ' + res.error); loadSlipIn(); });
}

async function viewDaily2(note) {

  const owner = me.role === 'owner';
  const types = r.itemTypes?.length ? r.itemTypes : ['รักษา', 'X-ray', 'ขายของ'];
  const bills = {};

    <!-- v65 ชั้นบนสุด: ยอดวันนี้ → คนไข้ที่มาแล้วยังไม่ลงเงิน (กดแล้วไปหน้าการมาของคนไข้ ไม่ต้องกรอกซ้ำ) → รายการ → ลงรายรับคนไม่มีนัด -->

      <div class="s">${[b.cash && 'สด ' + baht(b.cash), b.transfer && 'โอน ' + baht(b.transfer), b.card && 'บัตร ' + baht(b.card)].filter(Boolean).join(' · ')} · โดย ${esc(b.by)}</div>

      </form></details>
    <div class="card"><div class="t">ปิดยอดสิ้นวัน</div>
      ${r.closeInfo ? `<p class="s">ปิดยอดแล้ว เงินสด ${baht(r.closeInfo.cash)}${r.closeInfo.received ? ' · หมอรับแล้ว' : ' · รอหมอรับ'} (ปิดซ้ำได้ถ้านับใหม่)</p>` : '<p class="s">นับเงินสดทั้งหมดแล้วส่งหมอ · ถ้ามีรูดบัตร แนบสลิปปิดยอดบัตร (Settlement)</p>'}
      <form id="cl2"><label for="clAmt2">เงินสดที่นับได้ (ระบบ ${baht(sum.cash)})</label><input id="clAmt2" type="number" inputmode="decimal" required>
        ${sum.card > 0 ? `<label>สลิปปิดยอดบัตร (ระบบ ${baht(sum.card)})</label><input id="clCardPh" type="file" accept="image/*"><label for="clCard">ยอดตามสลิปบัตร</label><input id="clCard" type="number" inputmode="decimal" value="${sum.card}">` : ''}

  // v65 คนไข้มีนัดที่มาแล้ว: ลงเงินแล้วหรือยัง · กดแล้วเปิดหน้าการมาของคนไข้ (งาน · เงิน · นัดต่อ ที่เดียว)
  if (smaCan('appt')) call('apptDay', { date: todayISO() }).then(ad => {
    const box = document.getElementById('dAppt'); if (!box || !ad.ok) return;
    const paidKey = new Set(r.list.flatMap(x => [x.dn && 'D' + x.dn, x.nick && 'N' + x.nick]).filter(Boolean));

  });
  const items = document.getElementById('items');
  const totalOf = () => [...items.querySelectorAll('.iAmt')].reduce((n, i) => n + num2(i.value), 0);

  addItem.onclick = () => { items.insertAdjacentHTML('beforeend', itemRow(1)); bindItem(items.lastElementChild); };
  [pCash, pTr, pCard].forEach(i => i.oninput = upd);
  app.querySelectorAll('[data-all]').forEach(b => b.onclick = () => { const t = totalOf(); pCash.value = b.dataset.all === 'cash' ? t : ''; pTr.value = b.dataset.all === 'transfer' ? t : ''; pCard.value = b.dataset.all === 'card' ? t : ''; upd(); });
  dDn.onchange = () => { const p = r.patients.find(x => x.dn === dDn.value.trim()); if (p) { dNick.value = p.nick; items.querySelectorAll('.iDoc').forEach(s => { if (!s.value && p.doctor) s.value = p.doctor; }); } };

    viewDaily2(res.diff ? 'รับแล้ว · ยอดต่างจากเคาน์เตอร์ ' + baht(res.diff) : 'รับเงินสดแล้ว');

    const box = b.parentElement.querySelector('.xBox');

    box.querySelector('form').onsubmit = async ev => { ev.preventDefault();
      const sb = box.querySelector('button'); sb.disabled = true;
      const ph = await fileToData(box.querySelector('input')); if (!ph) { sb.disabled = false; return; }
      const up = await call('capUpload', { photos: ph, hint: 'slip_in' });

      const res = await call('capConfirm', { id: up.id, kind: 'slip_in', data: { bills: [b.dataset.slip2], amount: up.draft.amount, ref: up.draft.ref, date: up.draft.date } });
      if (!res.ok) { sb.disabled = false; return flash(errV2(res)); }
      viewDaily2('แนบสลิปแล้ว' + (up.draft.amount ? ' · ยอดในสลิป ' + baht(up.draft.amount) : ''));
    };
  });
  app.querySelectorAll('[data-cancel2]').forEach(b => b.onclick = () => {
    const box = b.parentElement.querySelector('.xBox');
    box.innerHTML = `<form class="move"><div class="grow"><label>เหตุผลที่ยกเลิก</label><input required></div><button class="btn small" type="submit">ยืนยันยกเลิก</button></form>`;

      for (const id of b.dataset.cancel2.split(',')) { const res = await call('dailyCancel', { id, reason: box.querySelector('input').value }); if (!res.ok) return flash(errV2(res)); }
      viewDaily2('ยกเลิกแล้ว');
    };
  });
  document.getElementById('cl2').onsubmit = async ev => { ev.preventDefault();
    const b = ev.target.querySelector('button'); b.disabled = true;
    const cp = document.getElementById('clCardPh');
    const cardSlips = cp && cp.files.length ? await fileToData(cp) : [];
    const res = await call('dailyClose2', { counted: clAmt2.value, cardAmount: document.getElementById('clCard')?.value ?? '', cardSlips: cardSlips || [] });
    b.disabled = false;
    if (!res.ok) return flash(errV2(res));
    viewDaily2(res.match ? 'ปิดยอดแล้ว ยอดตรง · แจ้งหมอให้กดรับเงินสดแล้ว' : 'ปิดยอดแล้ว แต่ยอดไม่ตรง (เงินสดต่าง ' + baht(res.cashDiff) + (res.cardDiff ? ' · บัตรต่าง ' + baht(res.cardDiff) : '') + ') แจ้งหมอแล้ว');
  };
  if (owner) bindOwnerReports();
}

let capOpen = '';
async function viewCapture(note) {
  app.innerHTML = '<div class="center">กำลังโหลด…</div>';
  const r = await call('capHome');
  if (!r.ok) return showError('โหลดไม่ได้: ' + r.error);
  capDrafts = r.pending;
  const L = r.lists, cats = L.cats || [], catName = id => (cats.find(c => c.id === id) || {}).name || '';
  const of = id => capDrafts.filter(d => (d.cat || '') === id);
  const legacy = capDrafts.filter(d => !cats.some(c => c.id === d.cat));
  const sec = c => { const n = of(c.id).length;
    return `<details class="card" data-cc="${esc(c.id)}" ${n || capOpen === c.id ? 'open' : ''}><summary class="t" style="cursor:pointer">${esc(c.name)}<span class="ccN">${n ? ` · <span class="warn">รอยืนยัน ${n}</span>` : ''}</span></summary>
      <label class="btn small" style="display:inline-flex;align-items:center;justify-content:center;margin-top:8px;width:100%">+ เพิ่มรูป<input type="file" accept="image/*" multiple data-in="${esc(c.id)}" style="display:none"></label>
      <div class="s ccProg"></div><div class="ccList">${of(c.id).map(d => capCard(d, L)).join('')}</div></details>`; };
  // v61 หน้าแรกของ "ถ่ายรูป" = ปุ่มเลือกหมวด (หมวดที่หมอตั้ง + ถ่ายรูปงานแล็บ) · กดหมวดแล้วค่อยถ่าย/เพิ่มรูปของหมวดนั้น
  const labBtn = smaCan('lab') ? `<button type="button" data-sma-page="labphotos"><span class="sma-symbol" aria-hidden="true">◎</span><span>ถ่ายรูปงานแล็บ<br><span class="s">แนบกับใบงานและเคส</span></span></button>` : '';
  const catBtn = c => { const n = of(c.id).length;
    return `<button type="button" data-capcat="${esc(c.id)}"><span class="sma-symbol" aria-hidden="true">▤</span><span>${esc(c.name)}${n ? `<br><span class="warn">รอยืนยัน ${n}</span>` : ''}</span></button>`; };
  const doneOf = id => r.done.filter(x => id == null || (x.cat || '') === id);
  const doneList = list => list.length ? `<details class="card"><summary class="t" style="cursor:pointer">บันทึกแล้วล่าสุด (${list.length})</summary>${list.map(x => `<div class="s"><a href="${esc(x.url)}" target="_blank" rel="noopener">รูป</a> · ${esc(x.at)} · ${esc(x.by)}${x.cat ? ' · ' + esc(catName(x.cat)) : ''} · ${esc(x.target)}</div>`).join('')}</details>` : '';
  const cur = cats.find(c => c.id === capOpen);
  if (!cur) {
    capOpen = '';
    const btns = cats.map(c => catBtn(c) + (c.id === 'lab' ? labBtn : '')).join('') + (cats.some(c => c.id === 'lab') ? '' : labBtn);
    app.innerHTML = `
    <div id="m">${note ? `<div class="msg ok">${esc(note)}</div>` : ''}</div>
    <div class="sma-subhead"><div><h2>ถ่ายรูป</h2><div class="s">เลือกหมวดก่อน แล้วค่อยถ่ายหรือเพิ่มรูปของหมวดนั้น</div></div></div>
    <div class="sma-menu">${btns}</div>
    ${legacy.length ? `<details class="card" data-cc="" open><summary class="t" style="cursor:pointer">เอกสารเดิม (ก่อนแยกหัวข้อ) · รอยืนยัน ${legacy.length}</summary><div class="ccList">${legacy.map(d => capCard(d, L)).join('')}</div></details>` : ''}
    ${doneList(doneOf(null))}`;
    app.querySelectorAll('[data-capcat]').forEach(b => b.onclick = () => { capOpen = b.dataset.capcat; window.scrollTo(0, 0); viewCapture(); });
    bindCapCards(L); smaBindLinks(app);
    return;
  }
  app.innerHTML = `
    <div id="m">${note ? `<div class="msg ok">${esc(note)}</div>` : ''}</div>
    <div class="sma-subhead"><div><h2>${esc(cur.name)}</h2><div class="s">กด "+ เพิ่มรูป" (เลือกได้หลายรูป) ระบบอ่านให้ ช่องสีเหลืองคือที่ระบบไม่แน่ใจ ตรวจแล้วกดยืนยันทีละใบ</div></div><button type="button" class="btn ghost small" id="capBack">← หมวดทั้งหมด</button></div>
    <div class="card" data-cc="${esc(cur.id)}">

    ${doneList(doneOf(cur.id))}`;

  app.querySelectorAll('[data-in]').forEach(inp => inp.onchange = async () => {
    const cat = inp.dataset.in, box = inp.closest('[data-cc]'), prog = box.querySelector('.ccProg'), list = box.querySelector('.ccList');
    capOpen = cat;
    const files = [...inp.files];
    for (let i = 0; i < files.length; i++) {
      prog.textContent = `กำลังอ่านรูปที่ ${i + 1}/${files.length}…`;
      let data; try { data = await shrinkImage(files[i]); } catch (e) { flash(e.message); continue; }
      const up = await call('capUpload', { photos: [data], cat });
      if (!up.ok) { flash(errV2(up)); continue; }
      const d = { id: up.id, url: up.url, kind: up.draft.kind, draft: up.draft, suggest: up.suggest, status: 'รอยืนยัน', ocr: up.ocr, cat };
      capDrafts.unshift(d);
      list.insertAdjacentHTML('afterbegin', capCard(d, L));
      bindCapCards(L);
    }
    const n = of(cat).length; box.querySelector('.ccN').innerHTML = n ? ` · <span class="warn">รอยืนยัน ${n}</span>` : '';
    prog.textContent = files.length ? `อ่านเสร็จ ${files.length} รูป ตรวจแล้วกดยืนยันทีละใบ` : '';
    inp.value = '';
  });
  bindCapCards(L); smaBindLinks(app);
}

function capKindOpts(c) {
  const m = CAP_KIND_BY_CAT[c.cat];

}
function capCard(c, L) {

    <label>ประเภทเอกสาร</label><select class="fKind">${capKindOpts(c).map(([k, t]) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${t}</option>`).join('')}</select>
    <div class="fBody">${capFields(kind, d, c.suggest || {}, L)}</div>
    <button class="btn fOk" style="width:100%;margin-top:10px">ยืนยัน</button></div>`;
}
function bindCapCards(L) {
  app.querySelectorAll('[data-cap]').forEach(el => {
    if (el.dataset.bound) return; el.dataset.bound = 1;
    const c = capDrafts.find(x => x.id === el.dataset.cap);
    const body = el.querySelector('.fBody');
    const bindLines = () => { const a = el.querySelector('.fAddLine'); if (a) a.onclick = () => el.querySelector('.fLines').insertAdjacentHTML('beforeend', lineRow({}, L)); };
    bindLines();
    el.querySelector('.fKind').onchange = e => { body.innerHTML = capFields(e.target.value, c.draft || {}, c.suggest || {}, L); bindLines(); };
    el.querySelector('.fOk').onclick = async () => {
      const kind = el.querySelector('.fKind').value, q = s => el.querySelector(s), v = s => q(s)?.value ?? '';
      let data = {};
      if (kind === 'slip_in') data = { date: v('.fDate'), amount: v('.fAmt'), ref: v('.fRef'), from: c.draft?.from, bills: [...el.querySelectorAll('.fBill:checked')].map(x => x.value) };
      if (kind === 'slip_out') data = { date: v('.fDate'), amount: v('.fAmt'), ref: v('.fRef'), method: v('.fMethod'), ids: (el.querySelector('.fPay:checked')?.value || '').split(',').filter(Boolean) };
      if (kind === 'invoice' || kind === 'billing') data = { vendor: v('.fVendor'), docNo: v('.fNo'), date: v('.fDate'), due: v('.fDue'), total: v('.fAmt'), vat: v('.fVat'), patient: v('.fPt'), doctor: v('.fDoc'), work: v('.fWork'), paid: !!q('.fPaid')?.checked,
        lines: [...el.querySelectorAll('.fLine')].map(x => ({ date: x.querySelector('.lDate').value, inv: x.querySelector('.lInv').value, amount: x.querySelector('.lAmt').value, patient: x.querySelector('.lPt').value, work: x.querySelector('.lWork').value, doctor: x.querySelector('.lDoc').value })) };
      if (kind === 'expense') data = { date: v('.fDate'), amount: v('.fAmt'), vendor: v('.fVendor2'), items: v('.fItems') || v('.fVendor2'), cat: v('.fCat'), pay: v('.fPayBy'), ref: c.draft?.ref };
      if (kind === 'settlement') data = { date: v('.fDate'), amount: v('.fAmt'), count: v('.fCount'), ref: v('.fRef') };
      const b = el.querySelector('.fOk'); b.disabled = true; b.textContent = 'กำลังบันทึก…';
      let res = await call('capConfirm', { id: c.id, kind, data });
      if (!res.ok && res.error === 'pay_mismatch' && confirm(res.msg)) res = await call('capConfirm', { id: c.id, kind, data: { ...data, force: true } });
      if (!res.ok && res.error === 'dup_slip' && confirm(res.msg + '\nยืนยันว่าใช้ซ้ำ?')) res = await call('capConfirm', { id: c.id, kind, data: { ...data, allowDup: true } });
      if (!res.ok && res.error === 'dup_bill' && confirm('⚠️ ' + res.msg)) res = await call('capConfirm', { id: c.id, kind, data: { ...data, allowDupBill: true } });
      b.disabled = false; b.textContent = 'ยืนยัน';
      if (!res.ok) return flash(errV2(res));
      capDrafts = capDrafts.filter(x => x.id !== c.id); el.remove();
      flash(res.pending ? 'เก็บเป็นสลิปรอจับคู่แล้ว' : res.flags?.length ? 'บันทึกแล้ว · ตรวจ: ' + res.flags.join(' · ') : 'บันทึกแล้ว', true);
    };
  });
}

// v58: display-only navigation; the existing identity, permissions, APIs and forms remain authoritative.
function smaCan(tab) {
  if (!me) return false;
  const b = tabs.querySelector('[data-tab="' + tab + '"]');
  return !!b && !b.hidden && (!me.tabs || me.tabs.includes(tab));
}
function smaIsLab() { return !!me && /ช่าง|แล็บ/.test(String(me.position || '')); }
function smaIsAssistant() { return !!me && String(me.position || '').trim() === 'ผู้ช่วยทันตแพทย์'; }
function smaGo(page) {
  const perm = smaPermission(page);
  if (perm && !smaCan(perm)) return;
  smaRecordUse('menu:' + page);
  if (page === 'more' && location.hash === '#more') return viewSmaMore();
  if (location.hash === '#' + page) return route();
  location.hash = page;
}
function smaDock(page) {
  smaBrand();
  let dock = document.getElementById('smaDock');
  if (!dock) { dock = document.createElement('nav'); dock.id = 'smaDock'; dock.setAttribute('aria-label', 'เมนูหลัก'); document.body.appendChild(dock); }
  const nav = [['tasks','⌂','หน้าหลัก'], smaIsLab() ? ['lab','▧','งานแล็บ'] : ['appt','▦','นัดหมาย'], smaIsLab() ? ['labphotos','◎','ถ่ายรูป'] : ['cases','♡','เคส'], ['more','⊞','เพิ่มเติม']];
  const active = nav.some(n => n[0] === page) ? page : 'more';
  dock.hidden = false;
  dock.innerHTML = nav.filter(n => n[0] === 'more' || smaCan(smaPermission(n[0]))).map(n => `<button type="button" data-sma-page="${n[0]}" aria-pressed="${active === n[0]}"><span class="sma-symbol" aria-hidden="true">${smaIconFor(n[0])}</span>${n[2]}</button>`).join('');
  dock.querySelectorAll('[data-sma-page]').forEach(b => b.onclick = () => smaGo(b.dataset.smaPage));
}
function smaBindLinks(host) {

// Aggregate deliberate menu clicks locally; never retain patient identifiers, form values, LINE IDs or tokens.
function smaRecordUse(key) {
  if (!me || !/^(menu:[a-z]+|action:newappt)$/.test(key)) return;
  try {
    const name = 'sma_usage_v1_' + String(me.nickname || 'staff');
    const current = JSON.parse(localStorage.getItem(name) || '{}');
    const today = todayISO();
    if (current.day !== today) { current.day = today; current.today = {}; }
    current.total = current.total || {};
    current.today[key] = (Number(current.today[key]) || 0) + 1;
    current.total[key] = (Number(current.total[key]) || 0) + 1;
    localStorage.setItem(name, JSON.stringify(current));
  } catch (e) {}
}

}

function smaBrand(){const h=document.querySelector('header'),title=document.getElementById('title');if(!h||h.dataset.smaBrand)return;h.dataset.smaBrand='1';h.insertAdjacentHTML('afterbegin','<span class="sma-brand-logo">'+smaSvg('flower')+'</span>');title.innerHTML='<span>SMILE ART</span><small>a little care, every day</small>';h.insertAdjacentHTML('beforeend','<span class="sma-avatar" aria-hidden="true">'+esc(me.role==='owner'?'DD':smaIsLab()?'LB':smaIsAssistant()?'AS':'AD')+'</span>');}
function viewSmaMore(){
 const tile=(p,label,tone)=>'<button type="button" data-sma-page="'+p+'"><span class="sma-symbol '+tone+'">'+smaIconFor(p)+'</span><span>'+label+'</span></button>';
 const section=(name,items)=>{const permitted=items.filter(x=>smaCan(smaPermission(x[0])));return permitted.length?'<section class="sma-more-section"><div class="sma-more-heading"><h3>'+name+'</h3>'+(name==='การเงิน'&&me.role==='owner'?'<span class="sma-owner-tag">เฉพาะหมอ</span>':'')+'</div><div class="sma-menu">'+permitted.map(x=>tile(...x)).join('')+'</div></section>':'';};
 const care=[['checklist','งานค้าง','peach'],['recall','รีคอล 6 เดือน','pink'],['lab','งานแล็บ','blue'],['cap','ถ่ายรูป','mint']];
 if(smaIsLab())care.push(['appt','นัดหมาย','peach'],['cases','เคส','blue'],['labphotos','รูปงานแล็บ','pink'],['labfit','วันนัดใส่งาน','mint']);
 app.innerHTML='<div class="sma-subhead"><div><h2>เพิ่มเติม</h2><div class="s">ทุกอย่างของคลินิก อยู่ในมือเดียว</div></div></div>'+section('ดูแลคนไข้',care)+section('จัดการคลินิก',[['stock','สต็อก','blue'],['buy','ซื้อของ','peach'],['team','ทีมงาน','pink'],['daily','สรุปรายวัน','mint']])+section('การเงิน',[['pay','เจ้าหนี้','peach'],['payroll','เงินเดือน','pink'],['df','DF','blue']])+(smaCan('lab')&&!smaIsLab()?'<div class="sma-more-links">'+tile('labfit','วันนัดใส่งาน','mint')+tile('labphotos','รูปงานแล็บ','blue')+'</div>':'');smaBindLinks(app);
}

start();
</script>
